---

# -----------------------------------------------------------------------------
# File        : ctlabs-ansible/inventories/group_vars/all.yml
# Description : Variables used for all hosts
# -----------------------------------------------------------------------------

ctg_facts       : >-
                  {{
                    ansible_local
                    if ctg_os_family in ['redhat', 'debian']
                    else {
                      'ctlabs': (ansible_ctlabs | from_json) if ansible_ctlabs is defined else {},
                      'ctlabs_ad': (ansible_ctlabs_ad | from_json) if ansible_ctlabs_ad is defined else {}
                    }
                  }}
ctg_facts_dir   : "{{ 'C:/ProgramData/ansible/facts.d' if ctg_os_family == 'windows' else '/etc/ansible/facts.d' }}"
ctg_domain      : "{{ CTLABS_DOMAIN            | default('ctlabs.internal') }}"
ctg_project     : "{{ ctg_facts.ctlabs.project | default() }}"
ctg_env         : "{{ ctg_facts.ctlabs.env     | default() }}"

ctg_vault_addr  : "{{ lookup('env', 'VAULT_ADDR')  }}"
ctg_vault_token : "{{ lookup('env', 'VAULT_TOKEN') }}"

ctg_os          : "{{ ansible_distribution | lower }}{{ ansible_distribution_major_version if ansible_os_family != 'Windows' }}"
ctg_os_family   : "{{ ansible_os_family    | lower }}"
ctg_os_distro   : "{{ ansible_distribution | lower }}"
ctg_os_release  : "{{ ansible_distribution_release | lower }}"
ctg_os_version  : "{{ ansible_distribution_major_version }}"
ctg_virtype     : "{{ ansible_virtualization_type | lower }}"

ctg_date        : "{{ ansible_date_time.date }}"
ctg_systemd_dir : "/etc/systemd/system"
ctg_todaysdate  : "{{ '%Y%m%d' | strftime }}"
ctg_uxtime      : "{{ '%s' | strftime }}"
ctg_vendor      : "{{ ansible_system_vendor | lower }}"

ctg_host        : "{{ ansible_nodename | default(inventory_hostname) }}"
ctg_ipv4        : >-
                  {{
                    ansible_default_ipv4.address if ctg_os_family in ['redhat', 'debian'] else ansible_interfaces[0].ipv4.address
                  }}
ctg_cmd_ip      : "{{ '/usr/sbin/ip' if ctg_os_family == 'redhat' else '/bin/ip' }}"
ctg_hv          : "{{ (lookup('file', '/etc/hosts').splitlines() | select('match', '^\\S+\\s+host\\.containers\\.internal') | first | default('')).split()[0] }}"

# Lab CA publication default.
#
# ctlabs_ca runs before any cluster role and stages /etc/ca-ctlabs/ca-ctlabs.crt
# on every node, so the k8s cluster roles (rke2/k8s/k3s/kind/minikube) default
# to publishing it as a ConfigMap for charts (cert-vault-sync caProvider).
# This is the single system-wide default; a per-cluster lab overrides it per
# profile with the role's `ca_configmaps` fact (that fact wins over this
# global; the role default stays [] as the final fallback).
ctg_ca_configmaps:
  - name     : ca-ctlabs-crt
    namespace: security-tools
    key      : ca.crt
    file     : /etc/ca-ctlabs/ca-ctlabs.crt

# ctlabs repo paths (can be overridden via env or vars)
ctg_ansible_repo_dir  : "{{ lookup('env', 'CTLABS_ANSIBLE_REPO_DIR')   | default('/srv/ctlabs/ctlabs-ansible') }}"
ctg_terraform_repo_dir: "{{ lookup('env', 'CTLABS_TERRAFORM_REPO_DIR') | default('/srv/ctlabs/ctlabs-terraform') }}"
ctg_tools_repo_dir    : "{{ lookup('env', 'CTLABS_TOOLS_REPO_DIR')     | default('/srv/ctlabs/ctlabs-tools') }}"
