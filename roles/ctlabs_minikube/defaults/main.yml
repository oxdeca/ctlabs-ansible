---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_minikube/defaults/main.yml
# Description : main defaults file
# ------------------------------------------------------------------------------

versions:
  minikube : 1.37.0
  k8s      : 1.34.0
  kubectl  : 1.34.0
  helm     : 4.1.4

ctlabs_minikube:
  defaults:
    pkgs:
      redhat:
        - name: python3-kubernetes
      debian:
        - name: podman
        - name: python3-kubernetes
      minikube:
        url  : "https://github.com/kubernetes/minikube/releases/download/v{{ versions.minikube }}/minikube-linux-amd64"
        path : /usr/bin/minikube
        mode : '0755'
      kubectl:
        #url  : "https://storage.googleapis.com/kubernetes-release/release/v{{ versions.kubectl }}/bin/linux/amd64/kubectl"
        url  : "https://dl.k8s.io/release/v{{ versions.kubectl }}/bin/linux/amd64/kubectl"
        path : /usr/bin/kubectl
        mode : '0755'
      helm:
        url    : "https://get.helm.sh/helm-v{{ versions.helm }}-linux-amd64.tar.gz"
        tmptar : /tmp/helm.tar.gz
        tmpdir : /tmp
        tardir : /tmp/linux-amd64
        path   : /usr/bin/helm
        mode   : '0755'
    repos  : []
    charts : []
    proxy:
      interface : "{{ ansible_default_ipv4.interface | default('') }}"
      kubeconfig: /home/minikube/.kube/config
    config:
      profile:
        template : minikube.profile.j2
        file     : /etc/profile.d/minikube.sh
      sudo:
        template : minikube.sudo.j2
        file     : /etc/sudoers.d/minikube
    handlers:
    service:
      net:
        name     : minikube-net.service
        template : minikube-net.service.j2
        subnet   : 192.168.49.0/24
        gw       : 192.168.49.1
      main:
        name     : minikube.service
        template : minikube.service.j2
        user     : minikube
        group    : minikube
        groups   : []
  os:
    - debian12
  virtype:
    - kvm
