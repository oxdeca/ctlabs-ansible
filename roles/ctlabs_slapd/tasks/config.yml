---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_slapd/tasks/config.yml
# Description : configurations
# ------------------------------------------------------------------------------

- name: ctlabs_slapd.tasks.config.tls.dir.exists
  file:
    name : "{{ ctlabs_slapd.defaults.config.tls.dir }}"
    state: directory

- name: ctlabs_slapd.tasks.config.log.dir.exists
  file:
    name : "{{ ctlabs_slapd.defaults.config[ctg_os_family].log_dir }}"
    state: directory
    owner: "{{ ctlabs_slapd.defaults.service[ctg_os_family].user  }}"
    group: "{{ ctlabs_slapd.defaults.service[ctg_os_family].group }}"

- name: ctlabs_slapd.tasks.config.run.dir.exists
  file:
    name : "{{ ctlabs_slapd.defaults.config[ctg_os_family].run_dir }}"
    state: directory
    owner: "{{ ctlabs_slapd.defaults.service[ctg_os_family].user  }}"
    group: "{{ ctlabs_slapd.defaults.service[ctg_os_family].group }}"

- name: ctlabs_slapd.tasks.config.tls.prepare
  copy:
    src  : "{{ ctlabs_slapd.defaults.config.ca_ctlabs.certdir }}/{{ item.name }}"
    dest : "{{ ctlabs_slapd.defaults.config.tls.dir }}/{{ item.name }}"
    mode : "{{ item.mode }}"
    owner: "{{ ctlabs_slapd.defaults.service[ctg_os_family].user }}"
    group: "{{ ctlabs_slapd.defaults.service[ctg_os_family].group }}"
  loop:
    - { name: "{{ ctlabs_slapd.defaults.config.tls.crt }}", mode: '0640' }
    - { name: "{{ ctlabs_slapd.defaults.config.tls.key }}", mode: '0600' }
    - { name: "{{ ctlabs_slapd.defaults.config.tls.prv }}", mode: '0600' }
    - { name: "{{ ctlabs_slapd.defaults.config.tls.ca  }}", mode: '0640' }

- name: ctlabs_slapd.tasks.config.tls.enable
  template:
    src  : "{{ ctlabs_slapd.defaults.config.default.template }}"
    dest : "{{ ctlabs_slapd.defaults.config.default.file     }}"
  notify: ctlabs_slapd.handlers.service.restart

- name: ctlabs_slapd.tasks.config.krb5.install
  when: ctlabs_slapd_krb5.manage | bool
  template:
    src : "{{ ctlabs_slapd_krb5.template }}"
    dest: "{{ ctlabs_slapd_krb5.file     }}"

- name: ctlabs_slapd.tasks.config.keytab.dir.exists
  when: ctlabs_slapd_gssapi_enabled
  file:
    path : "{{ ctlabs_slapd.defaults.config.keytab.dest_dir }}"
    state: directory
    owner: "{{ ctlabs_slapd.defaults.service[ctg_os_family].user  }}"
    group: "{{ ctlabs_slapd.defaults.service[ctg_os_family].group }}"
    mode : '0750'

- name: ctlabs_slapd.tasks.config.keytab.install
  when: ctlabs_slapd_gssapi_enabled
  copy:
    src  : "{{ ctlabs_slapd.defaults.config.keytab.src_dir  }}/{{ ctlabs_slapd_gssapi_db.bind.keytab }}.keytab"
    dest : "{{ ctlabs_slapd.defaults.config.keytab.dest_dir }}/{{ ctlabs_slapd_gssapi_db.bind.keytab }}.keytab"
    owner: "{{ ctlabs_slapd.defaults.service[ctg_os_family].user  }}"
    group: "{{ ctlabs_slapd.defaults.service[ctg_os_family].group }}"
    mode : '0600'
  notify: ctlabs_slapd.handlers.service.restart

- name: ctlabs_slapd.tasks.config.dir.slapd.moved
  shell: |
    if [ -d "{{ ctlabs_slapd.defaults.config[ctg_os_family].slapd_dir }}" ]; then 
      mv "{{ ctlabs_slapd.defaults.config[ctg_os_family].slapd_dir }}" "{{ ctlabs_slapd.defaults.config[ctg_os_family].slapd_dir }}.bak"
    fi
  ignore_errors: true

- name: ctlabs_slapd.tasks.config.schemas
  copy:
    src  : "{{ item }}"
    dest : "{{ ctlabs_slapd.defaults.config[ctg_os_family].dir }}/schema/{{ item }}"
  loop: "{{ ctlabs_slapd.defaults.config.schemas }}"

- name: ctlabs_slapd.tasks.config.install
  template:
    src  : "{{ ctlabs_slapd.defaults.config[ctg_os_family].template }}"
    dest : "{{ ctlabs_slapd.defaults.config[ctg_os_family].file     }}"
  notify: ctlabs_slapd.handlers.service.restart

- name: ctlabs_slapd.tasks.config.files
  copy:
    src  : "{{ item.src }}"
    dest : "{{ item.dst }}"
  loop: "{{ ctlabs_slapd.defaults.files }}"
