---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_slapd/tasks/precheck.yml
# Description : prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_slapd.tasks.precheck
  block:
    - name: ctlabs_slapd.tasks.precheck.os.supported
      assert:
        that     : ctg_os is in ctlabs_slapd.os
        fail_msg : "OS[{{ ctg_os }}] is not supported!"
  rescue:
    - name: ctlabs_slapd.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_slapd.tasks.precheck.dbs.var
  set_fact:
    ctlabs_slapd_dbs: "{{ ctlabs_slapd_dbs | default(ctlabs_slapd.defaults.config.dbs) }}"

- name: ctlabs_slapd.tasks.precheck.dbs.local_fact
  set_fact:
    ctlabs_slapd_dbs: "{{ ctg_facts.ctlabs_slapd.dbs | default(ctlabs_slapd_dbs) }}"

#
# Lists append across profile levels (defaults + host), so the same db can show
# up as several partial items. Merge items sharing a `suffix` (later wins, deep)
# - that is the per-host override; a new suffix stays an additional db.
# The role default is a dict keyed by name, accept that shape too.
#
- name: ctlabs_slapd.tasks.precheck.dbs.merge
  set_fact:
    ctlabs_slapd_dbs: >-
      {%- set ns = namespace(m={}) -%}
      {%- for db in (ctlabs_slapd_dbs.values() | list if ctlabs_slapd_dbs is mapping else ctlabs_slapd_dbs) -%}
      {%-   set k = db.suffix | default('') -%}
      {%-   set ns.m = ns.m | combine({k: (ns.m[k] | default({})) | combine(db, recursive=true)}) -%}
      {%- endfor -%}
      {{ ns.m.values() | list }}

#
# GSSAPI (bind.method: sasl): which db (if any) drives the client keytab /
# krb5.conf. Only one GSSAPI identity is supported per host - the first db
# configured for it wins.
#
- name: ctlabs_slapd.tasks.precheck.gssapi.dbs
  set_fact:
    ctlabs_slapd_gssapi_dbs: "{{ ctlabs_slapd_dbs | selectattr('bind.method', 'defined') | selectattr('bind.method', 'equalto', 'sasl') | list }}"

- name: ctlabs_slapd.tasks.precheck.gssapi.fact
  set_fact:
    ctlabs_slapd_gssapi_enabled: "{{ ctlabs_slapd_gssapi_dbs | length > 0 }}"
    ctlabs_slapd_gssapi_db     : "{{ ctlabs_slapd_gssapi_dbs | first | default(omit) }}"

#
# krb5.conf: var -> local fact -> default. `manage: false` (set via the
# krb5 local fact) when ctlabs_sssd already owns /etc/krb5.conf (AD backend)
# on this host.
#
- name: ctlabs_slapd.tasks.precheck.krb5.var
  set_fact:
    ctlabs_slapd_krb5: "{{ ctlabs_slapd_krb5 | default(ctlabs_slapd.defaults.config.krb5) }}"

- name: ctlabs_slapd.tasks.precheck.krb5.local_fact
  set_fact:
    ctlabs_slapd_krb5: "{{ ctg_facts.ctlabs_slapd.krb5 | default(ctlabs_slapd_krb5) }}"

# Unset realm/domain follow the GSSAPI db's bind.realm, so krb5.conf never
# disagrees with the realm slapd.conf binds with. Unset kdc = the DCs from the
# db uri (no reliance on DNS SRV records).
- name: ctlabs_slapd.tasks.precheck.krb5.derive
  when: ctlabs_slapd_gssapi_enabled | bool
  set_fact:
    ctlabs_slapd_krb5: >-
      {{ ctlabs_slapd_krb5 | combine({
           'realm' : (ctlabs_slapd_krb5.realm  | default('') or (ctlabs_slapd_gssapi_db.bind.realm | upper)),
           'domain': (ctlabs_slapd_krb5.domain | default('') or (ctlabs_slapd_gssapi_db.bind.realm | lower)),
           'kdc'   : (ctlabs_slapd_krb5.kdc | default([]) or (ctlabs_slapd_gssapi_db.uri.split() | map('regex_replace', '^ldaps?://([^:/]+).*$', '\1') | list))
         }) }}

# TODO
#   - check which config format we should install slapd.conf or OLC
