---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_graphify/tasks/config.yml
# Description : configurations
# ------------------------------------------------------------------------------

- name: ctlabs_graphify.tasks.config.group
  group:
    name   : "{{ ctlabs_graphify.defaults.config.group }}"
    system : true

- name: ctlabs_graphify.tasks.config.user
  user:
    name    : "{{ ctlabs_graphify.defaults.config.user }}"
    group   : "{{ ctlabs_graphify.defaults.config.group }}"
    system  : true
    shell   : /usr/sbin/nologin
    home    : "{{ ctlabs_graphify.defaults.config.dir }}"
    create_home: false

- name: ctlabs_graphify.tasks.config.dir
  file:
    path : "{{ ctlabs_graphify.defaults.config.dir }}"
    state: directory
    mode : '0755'

- name: ctlabs_graphify.tasks.config.update.script
  template:
    src  : graphify-update-all.sh.j2
    dest : /usr/local/bin/graphify-update-all
    mode : '0755'

- name: ctlabs_graphify.tasks.config.yaml_extract.copy
  copy:
    src  : ../tools/ansible_yaml_extract.py
    dest : "{{ ctlabs_graphify.defaults.config.dir }}/ansible_yaml_extract.py"
    mode : '0755'
