---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_wireguard/tasks/package.yml
# Description : install packages
# ------------------------------------------------------------------------------

- name: ctlabs_wireguard.tasks.package.kernel_module
  community.general.modprobe:
    name : wireguard
    state: present
  ignore_errors: true

- name: ctlabs_wireguard.tasks.package.install
  package:
    name  : "{{ item.name }}"
    state : present
  loop    : "{{ ctlabs_wireguard.defaults.pkgs[ctg_os_family] }}"
  register: result
  until   : result is success
