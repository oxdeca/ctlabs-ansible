---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_wireguard/tasks/precheck.yml
# Description : prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_wireguard.tasks.precheck
  block:
    - name: ctlabs_wireguard.tasks.precheck.os.supported
      assert:
        that    : ctg_os is in ctlabs_wireguard.os
        fail_msg: "OS [{{ ctg_os }}] is not supported!"

    - name: ctlabs_wireguard.tasks.precheck.facts.defined
      assert:
        that:
          - ctg_facts is defined
          - ctg_facts.ctlabs_wireguard is defined
        fail_msg: "Local facts for ctlabs_wireguard are missing on {{ inventory_hostname }}"

    - name: ctlabs_wireguard.tasks.precheck.type.check
      assert:
        that:
          - ctg_facts.ctlabs_wireguard.type in [ 'server', 'client' ]
        fail_msg: "No valid type specified for ctlabs_wireguard: '{{ ctg_facts.ctlabs_wireguard.type | default('') }}' (expected 'server' or 'client')"

    - name: ctlabs_wireguard.tasks.precheck.tunnel_ips.check
      assert:
        that:
          - ctg_facts.ctlabs_wireguard.server_ip is defined
          - ctg_facts.ctlabs_wireguard.server_ip | length > 0
          - ctg_facts.ctlabs_wireguard.client_ip is defined
          - ctg_facts.ctlabs_wireguard.client_ip | length > 0
        fail_msg: "server_ip and client_ip must both be defined for ctlabs_wireguard"

    - name: ctlabs_wireguard.tasks.precheck.client.remote.check
      when: ctg_facts.ctlabs_wireguard.type == 'client'
      assert:
        that:
          - ctg_facts.ctlabs_wireguard.remote is defined
          - ctg_facts.ctlabs_wireguard.remote | length > 0
        fail_msg: "remote endpoint address must be defined for client type"
  rescue:
    - name: ctlabs_wireguard.tasks.precheck.skip.unsupported
      meta: end_host
