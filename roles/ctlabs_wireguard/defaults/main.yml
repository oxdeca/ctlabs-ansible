---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_wireguard/defaults/main.yml
# Description : main defaults file
# ------------------------------------------------------------------------------

ctlabs_wireguard:
  defaults:
    pkgs:
      redhat:
        - name: wireguard-tools
      debian:
        - name: wireguard-tools
    config:
      dir                 : /etc/wireguard
      template            : wireguard.conf.j2
      dev                 : wg0
      port                : 51820
      controller_key_dir  : /etc/wireguard
      key_name            : wg0
      allowed_ips         : 0.0.0.0/0
      table               : "off"
      persistent_keepalive: 25
      forward             : true
    service:
      user  : root
      group : root
  os:
    - redhat9
    - centos9
    - debian11
    - debian12
