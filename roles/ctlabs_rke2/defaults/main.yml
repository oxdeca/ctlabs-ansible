---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_rke2/defaults/main.yml
# Description : main defaults
# ------------------------------------------------------------------------------

versions:
  rke2        : 1.33.3
  gateway_api : 1.6.3
  envoy       : 1.0.1

ctlabs_rke2:
  defaults:
    pkgs:
      debian:
        - name: python3-yaml
        - name: python3-kubernetes
        - url : https://github.com/derailed/k9s/releases/latest/download/k9s_linux_amd64.deb
      rke2:
        uri  : "https://github.com/rancher/rke2/releases/download/v{{ versions.rke2 }}+rke2r1/rke2.linux-amd64"
        path : /usr/bin/rke2
        mode : '0750'
      kubectl:
        path: /var/lib/rancher/rke2/bin/kubectl
    ingress:
      # rke2 bundles ingress-nginx; no provider defaults needed here
    gateway_api:
      crds: "https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{ versions.gateway_api }}/standard-install.yaml"
      file: /tmp/gateway-api-crds.yaml
      traefik:
        ns: traefik
    config:
      role     : server
      # Container Network Interface. RKE2 bundles its CNI charts, so `cilium`
      # deploys the packaged rke2-cilium chart (equivalent to the rke2 server
      # setting `cni: cilium`); any non-default value is written to the node's
      # config.yaml. Default `canal` = stock RKE2 behaviour.
      cni         : canal
      cni_supported: ['canal', 'cilium', 'multus', 'none']
      # Cilium tuning (only used when cni == 'cilium'). kube_proxy_replacement
      # sets `disable-kube-proxy: true` in config.yaml AND the matching
      # `kubeProxyReplacement` value on the bundled rke2-cilium chart via a
      # HelmChartConfig — the two must move together or services keep flowing
      # through kube-proxy. gateway_api is driven by gateway_api.provider:
      # set provider to 'cilium' to use Cilium's embedded Gateway API
      # implementation instead of traefik/envoy-gateway.
      cilium:
        kube_proxy_replacement: true
        operator_replicas     : 1
        manifests_dir : /var/lib/rancher/rke2/server/manifests
        helmchartconfig:
          template: cilium-helmchartconfig.yml.j2
          file    : /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
      servicelb:
        enabled: false
      ingress:
        enabled: false
        type   : "nginx"     # Options: 'traefik', 'nginx'
      # Unified rke2 config — replaces the per-flag ExecStart arguments
      # previously baked into the systemd units (cni, ingress disable,
      # servicelb, kube-proxy). Server + control nodes only.
      dir: /etc/rancher/rke2
      config_yaml:
        template: rke2.config.yaml.j2
        file    : /etc/rancher/rke2/config.yaml
      # Stale kube-proxy static pod manifest (upgrade path — see config.yml)
      kube_proxy_manifest: /var/lib/rancher/rke2/agent/pod-manifests/kube-proxy.yaml
      gateway_api:
        enabled : true
        provider: "traefik"  # Options: 'traefik', 'envoy-gateway', 'cilium'
      # CA cert bundle(s) to publish as ConfigMaps once the cluster is up, so
      # charts (e.g. cert-vault-sync's ClusterSecretStores) can read Vault's
      # TLS CA. Each entry: {name, namespace, key, file?} where `file` defaults
      # to the CA staged per node by ctlabs_ca. Empty list = no-op.
      ca_configmaps: []
      coredns:
        resources:
          requests:
            cpu   : 100m
            memory: 128Mi
          limits:
            cpu   : 100m
            memory: 128Mi
        split_dns:
          enabled: true
        public_resolvers:
          - 8.8.8.8
          - 8.8.4.4
          - 1.1.1.1
          - 1.0.0.1
      server:
        url: "https://{{ ansible_nodename }}:9345"
        token: /var/lib/rancher/rke2/server/token
      profile:
        template: rke2.profile.j2
        file    : /etc/profile.d/rke2.sh
    service:
      server:
        name     : rke2-server.service
        template : rke2-server.service.j2
      control:
        name     : rke2-control.service
        template : rke2-control.service.j2
      worker:
        name     : rke2-agent.service
        template : rke2-agent.service.j2
    sysconfig:
      dir    : /etc/sysconfig
      control:
        name    : /etc/sysconfig/rke2
        template: rke2-agent.sysconfig.j2
      worker:
        name    : /etc/sysconfig/rke2
        template: rke2-agent.sysconfig.j2
    bin:
      path: /usr/bin/rke2
      mode: '0750'
    crictl:
      src : /var/lib/rancher/rke2/agent/etc/crictl.yaml
      dest: /etc/crictl.yaml
  os:
    - centos8
    - centos9
    - debian11
    - debian12
  virtype:
    - kvm
