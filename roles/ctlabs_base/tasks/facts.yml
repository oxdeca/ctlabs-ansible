---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_base/tasks/facts.yml
# Description : write local role facts (declarative per host, both OS)
# ------------------------------------------------------------------------------

#
# Linux
#
- name: ctlabs_base.tasks.facts.linux
  when: ctg_os_family in ['redhat', 'debian']
  block:
    - name: ctlabs_base.tasks.facts.linux.write
      template:
        src : facts.json.j2
        dest: "{{ ctg_facts_dir }}/ctlabs_base.fact"

    - name: ctlabs_base.tasks.facts.linux.reread
      setup:

    - name: ctlabs_base.tasks.facts.linux.disks
      set_fact:
        ctlabs_base_disks: "{{ ctg_facts.ctlabs_base.disks | default([]) }}"

#
# Windows
#
- name: ctlabs_base.tasks.facts.windows
  when: ctg_os_family == 'windows'
  block:
    - name: ctlabs_base.tasks.facts.windows.facts_dir
      win_file:
        path  : "{{ ctg_facts_dir }}"
        state : directory

    - name: ctlabs_base.tasks.facts.windows.write
      win_template:
        src : facts.ps1.j2
        dest: "{{ ctg_facts_dir }}/ctlabs_base.ps1"

    - name: ctlabs_base.tasks.facts.windows.reread
      setup:
        fact_path: "{{ ctg_facts_dir }}"

    - name: ctlabs_base.tasks.facts.windows.disks
      set_fact:
        ctlabs_base_disks: "{{ ctg_facts.ctlabs_base.disks | default([]) }}"
