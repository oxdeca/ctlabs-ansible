---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_kibana/tasks/facts.yml
# Description : write local facts
# ------------------------------------------------------------------------------

- name: ctlabs_kibana.tasks.facts.write
  when: query('ansible.builtin.fileglob', 'templates/facts.json.j2') | length > 0
  tags:
    - setup
    - ctlabs_kibana.facts
  template:
    src : facts.json.j2
    dest: "{{ ctg_facts_dir }}/ctlabs_kibana.fact"
