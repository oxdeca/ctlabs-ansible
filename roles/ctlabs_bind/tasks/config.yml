---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_bind/tasks/config.yml
# Description : configurations
# ------------------------------------------------------------------------------

- name: ctlabs_bind.tasks.config.dirs.exist
  file:
    path : "{{ item }}"
    state: directory
    owner: "{{ ctlabs_bind.defaults.service[ctg_os_family].user  }}"
    group: "{{ ctlabs_bind.defaults.service[ctg_os_family].group }}"
  loop:
    - "{{ ctlabs_bind.defaults.config[ctg_os_family].keys_dir }}"

- name: ctlabs_bind.tasks.config.master
  when: ctg_facts.ctlabs_bind.type == 'master'
  block:
    - name: ctlabs_bind.tasks.config.named
      template:
        src  : master.named.conf.j2
        dest : "{{ ctlabs_bind.defaults.config[ctg_os_family].file }}"

    - name: ctlabs_bind.tasks.master.config.zones
      when: zone.type|default('master') == 'master'
      template:
        src  : zone.db.j2
        dest : "{{ ctlabs_bind.defaults.config[ctg_os_family].zones_dir }}/{{ zone.name }}.db"
      loop: "{{ ctlabs_bind_zones | unique }}"
      loop_control:
        loop_var: zone
      vars:
        zone_data: "{{ lookup('vars', 'zone_' + zone.name.replace('.', '_')) }}"
      notify: ctlabs_bind.handlers.named.service.reload

- name: ctlabs_bind.tasks.config.slave
  when: ctg_facts.ctlabs_bind.type == 'slave'
  block:
    - name: ctlabs_bind.tasks.slave.config.named
      template:
        src  : slave.named.conf.j2
        dest : "{{ ctlabs_bind.defaults.config[ctg_os_family].file }}"
      notify: ctlabs_bind.handlers.named.service.reload

# RedHat
- name: ctlabs_bind.tasks.config.redhat
  when: ctg_os_family == 'redhat'
  block:
    - name: ctlabs_bind.tasks.config.redhat.sysconfig
      template:
        src  : "{{ ctlabs_bind.defaults.config.redhat.sysconfig.template }}"
        dest : "{{ ctlabs_bind.defaults.config.redhat.sysconfig.file }}"
      notify:
        - ctlabs_bind.handlers.named.service.restart

# Debian
- name: ctlabs_bind.tasks.config.debian
  when: ctg_os_family == 'debian'
  block:
    - name: ctlabs_bind.tasks.service.debian.sysconfig
      template:
        src  : "{{ ctlabs_bind.defaults.config.debian.sysconfig.template }}"
        dest : "{{ ctlabs_bind.defaults.config.debian.sysconfig.file_deb }}"
      notify:
        - ctlabs_bind.handlers.named.service.restart
