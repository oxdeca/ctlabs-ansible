---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_claude_code/tasks/config.yml
# Description : configurations
# ------------------------------------------------------------------------------

- name: ctlabs_claude_code.tasks.config.group
  group:
    name   : "{{ ctlabs_claude_code.defaults.config.group }}"
    system : true

- name: ctlabs_claude_code.tasks.config.user
  user:
    name   : "{{ ctlabs_claude_code.defaults.config.user  }}"
    group  : "{{ ctlabs_claude_code.defaults.config.group }}"
    system : true

- name: ctlabs_claude_code.tasks.config.group.certs.member
  user:
    name  : "{{ ctlabs_claude_code.defaults.config.user   }}"
    group : "{{ ctlabs_claude_code.defaults.config.group  }}"
    groups: "{{ ctlabs_claude_code.defaults.config.groups }}"
    shell : /bin/bash

- name: ctlabs_claude_code.tasks.config.claude.dir
  file:
    path : "{{ ctlabs_claude_code.defaults.config.dir }}"
    state: directory
    owner: "{{ ctlabs_claude_code.defaults.config.user  }}"
    group: "{{ ctlabs_claude_code.defaults.config.group }}"
    mode : '0750'

- name: ctlabs_claude_code.tasks.config.settings.dir
  file:
    path : "{{ ctlabs_claude_code.defaults.config.settings.dir }}"
    state: directory
    mode: '0755'

- name: ctlabs_claude_code.tasks.config.settings.file
  template:
    src  : "{{ ctlabs_claude_code.defaults.config.settings.template }}"
    dest : "{{ ctlabs_claude_code.defaults.config.settings.file     }}"

- name: ctlabs_claude_code.tasks.config.commands.dir
  file:
    path : "{{ ctlabs_claude_code.defaults.config.commands_dir }}"
    state: directory
    mode : '0755'

- name: ctlabs_claude_code.tasks.config.commands.files
  template:
    src : command.md.j2
    dest: "{{ ctlabs_claude_code.defaults.config.commands_dir }}/{{ item.key }}.md"
  loop: "{{ ctlabs_claude_code_commands | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
