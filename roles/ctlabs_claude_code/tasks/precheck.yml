---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_claude_code/tasks/precheck.yml
# Description : prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_claude_code.tasks.precheck
  block:
    - name: ctlabs_claude_code.tasks.precheck.supported_os
      assert:
        that: ctg_os is in ctlabs_claude_code.os
        fail_msg: "OS [{{ ctg_os }}] is not supported!"
  rescue:
    - name: ctlabs_claude_code.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_claude_code.tasks.precheck.provider
  set_fact:
    ctlabs_claude_code_provider: "{{ ctlabs_claude_code.defaults.config.provider | combine(ctg_facts.ctlabs_claude_code.provider | default({}), recursive=true) }}"

- name: ctlabs_claude_code.tasks.precheck.provider.assert
  assert:
    that: ctlabs_claude_code_provider.active in ['anthropic', 'openrouter', 'vertexai']
    fail_msg: "Unknown provider: {{ ctlabs_claude_code_provider.active }}"

- name: ctlabs_claude_code.tasks.precheck.otlp
  set_fact:
    ctlabs_claude_code_otlp: "{{ ctlabs_claude_code.defaults.config.otlp | combine(ctg_facts.ctlabs_claude_code.otlp | default({}), recursive=true) }}"

- name: ctlabs_claude_code.tasks.precheck.settings
  set_fact:
    ctlabs_claude_code_settings: "{{ ctlabs_claude_code.defaults.config.preferences | combine(ctg_facts.ctlabs_claude_code.preferences | default({}), recursive=true) }}"
