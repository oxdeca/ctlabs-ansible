---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_claude_code/defaults/main.yml
# Description : main defaults
# ------------------------------------------------------------------------------

versions:
  nodejs: node_22.x

ctlabs_claude_code:
  defaults:
    repos:
      debian:
        - name: nodesource
          url : "https://deb.nodesource.com/{{ versions.nodejs }}"
          key : https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      redhat:
        - name: nodesource
          desc: NodeSource Repository
          url : "https://rpm.nodesource.com/pub_{{ versions.nodejs.split('_')[1] }}/nodistro/nodejs/$basearch"
          key : https://rpm.nodesource.com/gpgkey/ns-operations-public.key
    pkgs:
      debian: 
        - name: curl
        - name: nodejs
        - name: git
        - name: build-essential
        - name: python3-dev
        - name: libsecret-1-dev
      redhat:
        - name: nodejs
        - name: git
        - name: make
        - name: gcc-c++
        - name: python3-devel
        - name: libsecret-devel
      npm:
        - name: "@anthropic-ai/claude-code"
    config:
      prefdir: /etc/apt/preferences.d
      keydir : /etc/apt/keyrings
      dir    : /home/claude
      user   : claude
      group  : claude
      groups : [certs]
      settings:
        dir     : ~/.claude
        template: settings.json.j2
        file    : ~/.claude/settings.json
      provider:
        active     : anthropic
        anthropic:
          api_key: ""
        openrouter:
          api_key : ""
          base_url: "https://openrouter.ai/api"
        vertexai:
          project_id: ""
          region    : ""
      otlp:
        enabled        : false
        endpoint       : "http://prometheus.ctlabs.internal:9090/v1/metrics"
        resource_attrs : "user.email={{ ansible_user_id | default(ansible_user) }}"
      preferences:
        model          : "claude-sonnet-5"
        theme          : "dark"
        always_thinking: true
        fast_mode      : false
        fallback_model : ["haiku"]
        gce_metadata_host: ""
    certs:
      dir: /etc/ca-ctlabs
      crt: "{{ ansible_nodename }}.crt"
      key: "{{ ansible_nodename }}.prv"
      ca:  ca-ctlabs.crt
    service:
  os:
    - debian12
    - kali2025
    - kali2026
    - parrot6
    - parrot7
    - centos9
