---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_k3s/defaults/main.yml
# Description : main defaults
# ------------------------------------------------------------------------------

versions:
  k3s   : 1.34.3
  nginx : 1.14.1
  envoy : 1.0.1
  cilium: 1.20.3

ctlabs_k3s:
  defaults:
    pkgs:
      debian:
        - name: python3-yaml
        - name: python3-kubernetes
        - url : https://github.com/derailed/k9s/releases/latest/download/k9s_linux_amd64.deb
      k3s:
        uri  : "https://github.com/k3s-io/k3s/releases/download/v{{ versions.k3s }}+k3s1/k3s"
        path : /usr/bin/k3s
        mode : '0750'
    ingress:
      nginx:
        url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v{{ versions.nginx }}/deploy/static/provider/baremetal/deploy.yaml"
        lb :
          template: ingress-controller-lb.yml.j2
          file    : /tmp/ingress-controller-lb.yml
    config:
      role   : server
      # Container Network Interface. k3s bundles flannel (the default); for
      # `cilium` the server unit disables flannel + the built-in network-policy
      # controller and this role drops a HelmChart CR into the k3s manifests
      # dir, which k3s's own helm-controller deploys. Default `flannel` keeps
      # stock behaviour and emits nothing.
      cni          : flannel
      cni_supported: ['flannel', 'cilium']
      cilium:
        namespace   : kube-system
        # Must match k3s' default pod CIDR (10.42.0.0/16) so Cilium's
        # cluster-pool IPAM doesn't overlap the k3s service CIDR (10.43.0.0/16).
        cluster_cidr: 10.42.0.0/16
        manifests   : /var/lib/rancher/k3s/server/manifests
      ingress:
        enabled: false
        type   : "nginx"     # Options: 'traefik', 'nginx'
      gateway_api:
        enabled : true
        provider: "traefik"  # Options: 'traefik', 'envoy-gateway'
      servicelb:
        enabled: true  # k3s bundles klipper-lb; disabled via --disable=servicelb
      # CA cert bundle(s) to publish as ConfigMaps once the cluster is up, so
      # charts (e.g. cert-vault-sync's ClusterSecretStores) can read Vault's
      # TLS CA. Each entry: {name, namespace, key, file?} where `file` defaults
      # to the CA staged per node by ctlabs_ca. Empty list = no-op.
      ca_configmaps: []
      server:
        url: "https://{{ ansible_nodename }}:6443"
        token: /var/lib/rancher/k3s/server/token
      profile:
        template: k3s.profile.j2
        file    : /etc/profile.d/k3s.sh
    service:
      server:
        name     : k3s-server.service
        template : k3s-server.service.j2
      control:
        name     : k3s-control.service
        template : k3s-control.service.j2
      worker:
        name     : k3s-agent.service
        template : k3s-agent.service.j2
    sysconfig:
      dir: /etc/sysconfig
      control:
        name     : /etc/sysconfig/k3s
        template : k3s-agent.sysconfig.j2
      worker:
        name     : /etc/sysconfig/k3s
        template : k3s-agent.sysconfig.j2
    bin:
      path: /usr/bin/k3s
      mode: '0750'
  os:
    - centos8
    - centos9
    - debian11
    - debian12
  virtype:
    - kvm
