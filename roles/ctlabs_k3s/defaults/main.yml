---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_k3s/defaults/main.yml
# Description : main defaults
# ------------------------------------------------------------------------------

versions:
  k3s   : 1.34.3
  nginx : 1.14.1
  envoy : 1.0.1

ctlabs_k3s:
  defaults:
    pkgs:
      debian:
        - name: python3-yaml
        - name: python3-kubernetes
        - url : https://github.com/derailed/k9s/releases/latest/download/k9s_linux_amd64.deb
      k3s:
        uri  : "https://github.com/k3s-io/k3s/releases/download/v{{ versions.k3s }}+k3s1/k3s"
        path : /usr/bin/k3s
        mode : '0750'
    ingress:
      nginx:
        url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v{{ versions.nginx }}/deploy/static/provider/baremetal/deploy.yaml"
        lb :
          template: ingress-controller-lb.yml.j2
          file    : /tmp/ingress-controller-lb.yml
    config:
      role   : server
      ingress:
        enabled: false
        type   : "nginx"     # Options: 'traefik', 'nginx'
      gateway_api:
        enabled : true
        provider: "traefik"  # Options: 'traefik', 'envoy-gateway'
      server:
        url: "https://{{ ansible_nodename }}:6443"
        token: /var/lib/rancher/k3s/server/token
      profile:
        template: k3s.profile.j2
        file    : /etc/profile.d/k3s.sh
    service:
      server:
        name     : k3s-server.service
        template : k3s-server.service.j2
      control:
        name     : k3s-control.service
        template : k3s-control.service.j2
      worker:
        name     : k3s-agent.service
        template : k3s-agent.service.j2
    sysconfig:
      dir: /etc/sysconfig
      control:
        name     : /etc/sysconfig/k3s
        template : k3s-agent.sysconfig.j2
      worker:
        name     : /etc/sysconfig/k3s
        template : k3s-agent.sysconfig.j2
    bin:
      path: /usr/bin/k3s
      mode: '0750'
  os:
    - centos8
    - centos9
    - debian11
    - debian12
  virtype:
    - kvm
