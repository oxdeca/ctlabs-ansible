- name: ctlabs_helm.tasks.routing.httproute
  vars:
    ansible_python_interpreter: "{{ chart['interpreter'] | default(omit) }}"
    _gw_item       : "{{ chart['gateway'] }}"
    _route_name    : "{{ _gw_item['route_name']    | default(ctlabs_helm.defaults.gateway.route_name) }}"
    _route_backend : "{{ _gw_item['route_backend'] | default(ctlabs_helm.defaults.gateway.route_backend) }}"
    _route_port    : "{{ _gw_item['route_port']    | default(ctlabs_helm.defaults.gateway.route_port) | int }}"
  environment:
    KUBECONFIG: "{{ chart['kubeconfig'] | default(omit) }}"
  when: "'gateway' in chart"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'httproute.yml.j2') | from_yaml }}"
  register: res_route
  until   : res_route is success
  retries : 30
  delay   : 5
  loop: "{{ ctlabs_helm_charts }}"
  loop_control:
    loop_var: chart
