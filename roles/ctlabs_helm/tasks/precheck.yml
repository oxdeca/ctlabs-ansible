---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_helm/tasks/precheck.yml
# Description : tasks prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_helm.tasks.precheck
  block:
    - name: ctlabs_helm.tasks.precheck.os.supported
      assert:
        that: ctg_os is in ctlabs_helm.os
        fail_msg: "OS [{{ ctg_os }}] is not supported!"
  rescue:
    - name: ctlabs_helm.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_helm.tasks.precheck.repos
  set_fact:
    ctlabs_helm_repos: "{{ ctg_facts.ctlabs_helm.repos | default(ctlabs_helm.defaults.repos, true) }}"

- name: ctlabs_helm.tasks.precheck.charts
  set_fact:
    ctlabs_helm_charts: "{{ ctg_facts.ctlabs_helm.charts | default(ctlabs_helm.defaults.charts, true) }}"

#
# longhorn chart guard
#
# The longhorn chart may only be installed on a cluster whose storage engine
# (decided by the k8s master) is 'longhorn'. Installing it alongside the
# default 'local' engine (local-path-provisioner) conflicts: both want to be
# the default StorageClass and longhorn's mutating webhook hijacks PVCs.
# Only enforced when this lab also has a k8s role (k3s/rke2 labs are free).
#
- name: ctlabs_helm.tasks.precheck.longhorn.guard
  when: play_setup is defined and play_setup['k8s'] is defined
  block:
    - name: ctlabs_helm.tasks.precheck.longhorn.engine.fact
      set_fact:
        ctlabs_k8s_master_storage: "{{ item.value.storage | default('') | lower }}"
      when: item.value.role | default('') == 'master'
      loop: "{{ play_setup['k8s'] | default({}) | dict2items }}"

    - name: ctlabs_helm.tasks.precheck.longhorn.chart.fact
      set_fact:
        ctlabs_helm_has_longhorn_chart: >-
          {{ (ctlabs_helm_charts | selectattr('chart', 'search', 'longhorn') | list | length) > 0
             or (ctlabs_helm_charts | selectattr('name', 'equalto', 'longhorn') | list | length) > 0 }}

    - name: ctlabs_helm.tasks.precheck.longhorn.engine.required
      assert:
        that    : not (ctlabs_helm_has_longhorn_chart and (ctlabs_k8s_master_storage | default('')) != 'longhorn')
        fail_msg: "The 'longhorn' chart is configured for host [{{ inventory_hostname }}] but the k8s storage engine is '{{ ctlabs_k8s_master_storage | default('') or 'local' }}', not 'longhorn'. Either set storage: longhorn on the k8s master (helm profile), or remove the longhorn chart entry from the helm profile. They must not coexist."

