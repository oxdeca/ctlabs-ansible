---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_argoapp/defaults/main.yml
# Description : main defaults
#
# This role does NOT install ArgoCD itself - that is ctlabs_helm's job (the
# argo/argo-cd chart). This role only declares the ArgoCD 'Application' objects
# that ArgoCD then manages (cert-manager, external-secrets, ...).
# ------------------------------------------------------------------------------

ctlabs_argoapp:
  defaults:
    #
    # namespace holding the ArgoCD control plane, i.e. where the Application
    # CRs are created. This is the argo-cd chart's RELEASE NAMESPACE, not the
    # release name - ctlabs_helm deploys release 'argocd' into namespace 'argo'
    # ('helm list -A' shows NAME=argocd, NAMESPACE=argo). Getting these mixed up
    # silently targets the wrong namespace, so the precheck resolves the
    # controller there and fails loudly.
    #
    namespace  : argo

    #
    # cluster access. Empty kubeconfig = controller/kubeconfig default. Set
    # 'interpreter' to an 'ip vrf exec default python3' wrapper on hosts whose
    # cluster lives in the data VRF.
    #
    kubeconfig : ""
    interpreter: ""

    #
    # defaults for the Application spec. Everything an application declares
    # itself wins; these only fill the gaps.
    #
    project    : default
    server     : https://kubernetes.default.svc
    sync_policy:
      automated:
        prune    : true
        selfHeal : true
      syncOptions:
        - CreateNamespace=true

    #
    # ArgoCD's cascade-delete finalizer: deleting an Application removes the
    # resources it created. Set to [] to keep resources behind.
    #
    finalizers:
      - resources-finalizer.argocd.argoproj.io

    #
    # after applying, wait for each Application to report Synced + Healthy.
    #
    wait        : true
    wait_timeout: 600
    wait_delay  : 10

    #
    # how long to keep watching for a DEFINITIVE outcome after the apply, before
    # concluding the application is merely still rolling out and handing over to
    # wait_timeout. This is what turns a dead repository credential into a fast,
    # explanatory failure instead of a silent 600s stall - ArgoCD reports it as
    # sync.status=Unknown while health stays Healthy, so the naive
    # 'Synced + Healthy' wait never succeeds and never says why.
    #
    settle_retries: 6

    #
    # ArgoCD condition types that mean "this Application is not going to
    # reconcile, stop waiting for it". Waiting on Synced+Healthy alone turns any
    # of these into a silent wait_timeout stall whose real cause is only visible
    # in the ArgoCD UI. Note that health usually stays Healthy through all of
    # them - a failed comparison means there is no target state to diff against,
    # so running workloads are untouched and nothing can be pruned.
    #
    error_conditions:
      - ComparisonError
      - SyncError
      - InvalidSpecError
      - DeletionError

    #
    # how long to wait for the argoproj.io Application CRD to be Established
    # (it only exists once the argo-cd chart is installed).
    #
    crd_wait: 300

    #
    #
    # Git repositories the applications are allowed to fetch from, with the
    # credentials ArgoCD needs to do so. ArgoCD does NOT accept credentials on
    # the Application: it discovers them from Secrets in the ArgoCD namespace
    # labelled 'argocd.argoproj.io/secret-type: repository'. This list is what
    # creates those Secrets, which is why an application can name nothing but a
    # repoURL and still authenticate.
    #
    # Per entry:
    #   name            (required) Secret name, unique per repository
    #   url             (required) must match the application's source.repoURL
    #   type                  : 'git' (default) | 'helm' | 'oci'
    #   username, password    : HTTPS basic auth
    #   sshPrivateKey         : SSH auth, PEM content
    #   bearerToken           : HTTP bearer token
    #   insecure              : skip the repository server's TLS verification.
    #                           Needed for the self-signed ctlabs_ca certs the
    #                           lab git host serves - the alternative is mounting
    #                           that CA into argocd-repo-server.
    #   forceHttpBasicAuth    : skip auth method negotiation, force basic auth
    #   enableLfs, enableOCI, project, proxy, noProxy, tlsClientCertData
    #
    # Anything outside that list is dropped rather than passed through: ArgoCD
    # silently ignores stringData keys it does not recognise, so a typo
    # ('insecure_ssl') would surface as a mystery TLS failure, not an error.
    #
    # Secrets policy: credentials live here in PLAINTEXT in the local fact file,
    # the same way ctlabs_gitea keeps its own. Fine for a lab; anything shared or
    # long-lived should come from ctlabs_vault instead.
    #
    # An empty list is a complete no-op, exactly like applications.
    #
    repositories: []
    #
    # The applications to declare. Per-cluster inventory - normally supplied
    # per host as the ctlabs_argoapp local fact, not edited here.
    #
    # 'source' is ArgoCD's own spec.source, passed through verbatim, so any
    # source form ArgoCD supports (chart / directory / kustomize / plugin /
    # plain path) works without touching this role.
    #
    applications: []
  os:
    - centos8
    - centos9
    - redhat8
    - redhat9
    - debian11
    - debian12
