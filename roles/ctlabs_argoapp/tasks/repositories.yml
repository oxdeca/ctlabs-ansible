---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_argoapp/tasks/repositories.yml
# Description : repository credential Secrets
#
# ArgoCD does not accept credentials on the Application - it discovers them from
# Secrets in its own namespace labelled argocd.argoproj.io/secret-type. This
# creates those Secrets, so a git-backed application can name nothing but a
# repoURL and still authenticate.
#
# ORDERING IS LOAD-BEARING: this file is imported before applications.yml. The
# Secrets have to exist before an application that names the repo is created,
# otherwise the first sync fails with 'repository not found' - and because the
# role's sync policy is automated + selfHeal, that failure would be retried
# forever instead of surfacing.
#
# An empty list is a complete no-op, exactly like applications.
# ------------------------------------------------------------------------------

- name: ctlabs_argoapp.tasks.repositories
  when: ctlabs_argoapp_repositories | length > 0
  block:

    #
    # Snapshot what is already there BEFORE changing it, so a regression can be
    # undone. This must never itself fail the run: it exists only to make rollback
    # possible, and a snapshot that breaks the run defeats its own purpose.
    #
    - name: ctlabs_argoapp.tasks.repositories.capture
      vars:
        ansible_python_interpreter: "{{ ctlabs_argoapp_interpreter | default(omit, true) }}"
      environment:
        KUBECONFIG: "{{ ctlabs_argoapp_kubeconfig | default(omit, true) }}"
      kubernetes.core.k8s_info:
        kind          : Secret
        namespace     : "{{ ctlabs_argoapp_namespace }}"
        label_selectors:
          - argocd.argoproj.io/secret-type=repository
      register       : ctlabs_argoapp_repo_before
      failed_when    : false
      changed_when   : false
      # holds live credentials
      no_log         : true

    #
    # force: true -> svc.replace() (a genuine PUT) - see the detailed comment
    # in applications.yml for why (plain PATCH leaves stale fields behind;
    # server-side apply was tried first and rejected because it submits
    # explicit nulls to prune, which some CRD/object schemas reject). Same
    # staleness risk applies here: the Secret's stringData is built key-by-key
    # from an allowlist, so dropping e.g. `username` from a repositories entry
    # would otherwise leave the old value sitting in the live Secret forever.
    #
    # Same resourceVersion requirement as applications.yml - reuse the capture
    # task above instead of a second lookup, it already fetched every
    # repository-type Secret in this namespace.
    #
    - name: ctlabs_argoapp.tasks.repositories.existing.versions
      set_fact:
        ctlabs_argoapp_existing_repo_versions: >-
          {{
            ctlabs_argoapp_repo_before.resources | default([])
              | map(attribute='metadata')
              | items2dict(key_name='name', value_name='resourceVersion')
          }}

    - name: ctlabs_argoapp.tasks.repositories.apply
      vars:
        ansible_python_interpreter: "{{ ctlabs_argoapp_interpreter | default(omit, true) }}"
      environment:
        KUBECONFIG: "{{ ctlabs_argoapp_kubeconfig | default(omit, true) }}"
      kubernetes.core.k8s:
        state     : present
        definition: "{{ lookup('template', 'repository.yml.j2') | from_yaml }}"
        force     : true
      loop: "{{ ctlabs_argoapp_repositories }}"
      loop_control:
        loop_var: repo
      register: res_repo
      until   : res_repo is success
      retries : 30
      delay   : 5
