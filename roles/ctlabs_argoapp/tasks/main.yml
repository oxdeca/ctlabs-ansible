---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_argoapp/tasks/main.yml
# Description : main ctlabs_argoapp tasks file
# ------------------------------------------------------------------------------

- import_tasks: precheck.yml
  tags:
    - ctlabs_argoapp
    - ctlabs_argoapp.precheck
    # 'applications' and 'repositories' are carried here because this file is
    # where both lists get resolved: whichever of the two task files a caller
    # selects on its own must still pull precheck in with it
    - ctlabs_argoapp.applications
    - ctlabs_argoapp.repositories

- import_tasks: repositories.yml
  tags:
    - ctlabs_argoapp
    - ctlabs_argoapp.repositories
    # also tagged 'applications': limiting a run to -t ctlabs_argoapp.applications
    # must still create the credentials its git-backed apps need
    - ctlabs_argoapp.applications

# before applications.yml: a fresh ClusterSecretStore validates against this
# ConfigMap on the very first sync, and the namespace it lands in has to exist
# by then too. Same 'applications' tag carry as repositories -- an -t
# ctlabs_argoapp.applications run must not leave the stores without their CA.
- import_tasks: vault_ca.yml
  tags:
    - ctlabs_argoapp
    - ctlabs_argoapp.vault_ca
    - ctlabs_argoapp.applications

- import_tasks: applications.yml
  tags:
    - ctlabs_argoapp
    - ctlabs_argoapp.applications
