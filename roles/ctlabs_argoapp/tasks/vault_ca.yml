---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_argoapp/tasks/vault_ca.yml
# Description : Vault's TLS CA as a ConfigMap for cert-vault-sync
#
# cert-vault-sync's ClusterSecretStores take the Vault CA from a ConfigMap
# (secretStores.vault.ca.configMapName -> caProvider) instead of an inlined
# base64 caBundle, so the chart no longer creates that ConfigMap -- this does,
# from /etc/ca-ctlabs/ca-ctlabs.crt, which every node carries. That is the whole
# point: a PEM baked into the chart is only in sync with the lab because
# somebody re-rendered it for that lab, and goes stale on the next rebuild.
#
# OUT-OF-BAND BY DESIGN: the object is in no Application manifest, so ArgoCD
# neither tracks nor prunes it. The chart still rendering it made this
# concrete: the phase-2 sync pruned the hand-recreated copy, which is why the
# chart side stopped rendering it. Expect a few seconds of ClusterSecretStore
# errors between that push and this run; no cert/Secret loss (PushSecrets
# retry), so nothing here has to be atomic with the sync.
#
# Ordering: imported in main.yml BEFORE applications.yml, so the ConfigMap a
# fresh ClusterSecretStore validates against already exists on a fresh lab --
# and the namespace too, which is why Namespace is created here rather than
# left to the app's CreateNamespace.
#
# Opt-in (defaults.vault_ca.enabled), same no-op contract as
# applications/repositories: a host that declares nothing never touches the
# cluster through this file.
# ------------------------------------------------------------------------------

- name: ctlabs_argoapp.tasks.vault_ca
  when: ctlabs_argoapp_vault_ca['enabled'] | bool
  block:

    #
    # root:certs, mode 640 -- unreadable without become. slurp (not a lookup
    # on the controller) because the file lives on the node running this role.
    #
    - name: ctlabs_argoapp.tasks.vault_ca.read
      become: true
      slurp:
        src: "{{ ctlabs_argoapp_vault_ca['file'] }}"
      register: ctlabs_argoapp_vault_ca_crt
      changed_when: false

    #
    # state: present without force: the ConfigMap carries exactly one key we
    # own, so a strategic-merge patch is enough -- and unlike `force: true`
    # (svc.replace) it needs no resourceVersion dance. A CA regeneration only
    # changes that key's value, which a patch updates fine.
    #
    - name: ctlabs_argoapp.tasks.vault_ca.namespace
      vars:
        ansible_python_interpreter: "{{ ctlabs_argoapp_interpreter | default(omit, true) }}"
      environment:
        KUBECONFIG: "{{ ctlabs_argoapp_kubeconfig | default(omit, true) }}"
      kubernetes.core.k8s:
        state    : present
        definition:
          apiVersion: v1
          kind      : Namespace
          metadata  :
            name: "{{ ctlabs_argoapp_vault_ca['namespace'] }}"

    - name: ctlabs_argoapp.tasks.vault_ca.apply
      vars:
        ansible_python_interpreter: "{{ ctlabs_argoapp_interpreter | default(omit, true) }}"
      environment:
        KUBECONFIG: "{{ ctlabs_argoapp_kubeconfig | default(omit, true) }}"
      kubernetes.core.k8s:
        state     : present
        definition:
          apiVersion: v1
          kind      : ConfigMap
          metadata  :
            name     : "{{ ctlabs_argoapp_vault_ca['name'] }}"
            namespace: "{{ ctlabs_argoapp_vault_ca['namespace'] }}"
          data:
            "{{ ctlabs_argoapp_vault_ca['key'] }}": "{{ ctlabs_argoapp_vault_ca_crt['content'] | b64decode }}"
