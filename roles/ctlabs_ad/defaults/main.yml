---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_ad/defaults/main.yml
# Description : main defaults for Windows Active Directory (DC + member hosts)
# ------------------------------------------------------------------------------

ctlabs_ad:
  defaults:
    config:
      dc:
        # Last-resort fallback only. Every config value resolves as:
        #   role var (ctlabs_ad_*) -> ctlabs_ad local fact (ctg_facts.ctlabs_ad.*)
        #   -> this default.
        # A host is a DC only when a ctlabs `ad` setup profile (or the fact)
        # says so; otherwise it is a plain `member` (join/leave only).
        #   master : create the forest / first domain controller
        #   slave  : promote a replica domain controller into the domain
        #   member : join (or leave) an existing domain only
        role           : member
        domain         : ad.ctlabs.internal
        install_dns    : true
        # DNS resolvers for the production interface (eth1) - the lab's
        # bind servers (ns1/ns2, which forward the ad.* zone) plus a public
        # fallback. Fixed, lab-independent addresses (ns1/ns2 are the same
        # in every lab's *_data.ini).
        dns_servers:
          - 192.168.10.11
          - 192.168.20.11
          - 8.8.8.8
        # domain Administrator of a freshly promoted master. The packer /
        # sysprep'd Windows image ships this well-known account password.
        # Override with ctlabs_ad_admin_user / ctlabs_ad_admin_password.
        admin_user     : Administrator
        admin_password : ctlabs-BuildTime!1
        paths:
          database : 'C:\Windows\NTDS'
          log      : 'C:\Windows\NTDS'
          sysvol   : 'C:\Windows\SYSVOL'
        # OU tree created on the DC and used as member join targets
        ou:
          root    : ctlabs
          servers : servers
          environments:
            - dev
            - uat
            - prod
        # LDAPS with the host certificate issued by ctlabs_ca (DC only, opt-in:
        # per-host fact `ldaps`, or var ctlabs_ad_ldaps). ca_dir is on the
        # controller; windows_dir is where ctlabs_ca delivers the cert to the DC.
        ldaps:
          enabled     : false
          ca_dir      : /etc/ca-ctlabs
          ca_name     : ca-ctlabs
          ca_domain   : ctlabs.internal
          windows_dir : 'C:/ProgramData/ca-ctlabs'
        # candidate domain controllers a member host may be joined against
        # (only used when the ctlabs_ad fact does not pin a specific `master`)
        hosts:
          - dc1
          - dc2
        # Dedicated service-account Kerberos keytabs (DC only, opt-in: local
        # fact `keytabs`, or var ctlabs_ad_keytabs - default []). One AD user
        # per entry, a GSSAPI *client* identity (plain UPN, not a service
        # SPN - nothing looks these accounts up via SPN); ktpass extracts the
        # keytab with a random, never-stored password and the result is
        # staged on the controller at `keytab.dir` for a consuming role
        # (e.g. ctlabs_slapd) to copy out - same controller-staging broker
        # pattern ctlabs_ca uses for certificates.
        #
        # Idempotent by *staged file*, not by AD state: ktpass resets the
        # account's password on every run, so once a keytab is staged for a
        # name it is never regenerated - delete the staged file to rotate it.
        #
        # keytabs:
        #   - name     : svc-slapd   # sAMAccountName + keytab basename
        #     principal: ''          # UPN / ktpass -princ (without @REALM); defaults to `name`
        #     ou_path  : ''          # defaults to this host's ctlabs_ad_ou_path
        keytabs: []
        keytab:
          dir: /etc/keytabs
    vault:
      mount: secrets
      secrets:
        # domain-admin credentials (member/slave join, replica promotion)
        dc_join:
          path: kvv2/data/gcp/global/pleng/bootstrap
        # DSRM ("safe mode") password of a promoted domain controller
        dc_dsrm:
          path: secrets/data/gcp/global/pleng/bootstrap
  os:
    - microsoft windows server 2022 standard evaluation
