---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_guacamole/tasks/precheck.yml
# Description : prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_guacamole.tasks.precheck
  block:
    - name: ctlabs_guacamole.tasks.precheck.os.supported
      assert:
        that     : ctg_os is in ctlabs_guacamole.os
        fail_msg : "OS[{{ ctg_os }}] is not supported!"
  rescue:
    - name: ctlabs_guacamole.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_guacamole.tasks.precheck.user_mapping.users
  set_fact:
    ctlabs_guacamole_users: "{{ ctg_facts.ctlabs_guacamole.users | default(ctlabs_guacamole.defaults.config.user_mapping.users) }}"
