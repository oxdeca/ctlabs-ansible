---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_kind/tasks/precheck.yml
# Description : tasks prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_kind.tasks.precheck
  block:
    - name: ctlabs_kind.tasks.precheck.os.supported
      assert:
        that: ctg_os is in ctlabs_kind.os
        fail_msg: "OS [{{ ctg_os }}] is not supported!"

    - name: ctlabs_kind.tasks.precheck.virtype
      assert:
        that     : ctg_virtype is in ctlabs_kind.virtype
        fail_msg : "Virtualization Type '{{ ctg_virtype }}' not supported!"
  rescue:
    - name: ctlabs_kind.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_kind.tasks.precheck.plane
  set_fact:
    ctlabs_kind_plane: "{{ ctg_facts.ctlabs_kind.plane | default(ctlabs_kind.defaults.config.plane) }}"

- name: ctlabs_kind.tasks.precheck.name
  set_fact:
    ctlabs_kind_name: "{{ ctg_facts.ctlabs_kind.name | default(ctlabs_kind.defaults.config.name) }}"

- name: ctlabs_kind.tasks.precheck.image
  set_fact:
    ctlabs_kind_image: "{{ ctg_facts.ctlabs_kind.image | default(ctlabs_kind.defaults.config.image) }}"

- name: ctlabs_kind.tasks.precheck.nodes
  set_fact:
    ctlabs_kind_nodes: "{{ ctg_facts.ctlabs_kind.nodes | default(ctlabs_kind.defaults.config.node.count) }}"

- name: ctlabs_kind.tasks.precheck.ingress_enabled
  set_fact:
    ctlabs_kind_ingress_enabled: "{{ ctg_facts.ctlabs_kind.ingress.enabled | default(ctlabs_kind.defaults.config.ingress.enabled) }}"

- name: ctlabs_kind.tasks.precheck.ingress_type
  set_fact:
    ctlabs_kind_ingress_type: "{{ ctg_facts.ctlabs_kind.ingress.type | default(ctlabs_kind.defaults.config.ingress.type) }}"

- name: ctlabs_kind.tasks.precheck.gateway_api_enabled
  set_fact:
    ctlabs_kind_gateway_api_enabled: "{{ ctg_facts.ctlabs_kind.gateway_api.enabled | default(ctlabs_kind.defaults.config.gateway_api.enabled) }}"

- name: ctlabs_kind.tasks.precheck.gateway_api_provider
  set_fact:
    ctlabs_kind_gateway_api_provider: "{{ ctg_facts.ctlabs_kind.gateway_api.provider | default(ctlabs_kind.defaults.config.gateway_api.provider) }}"

- name: ctlabs_kind.tasks.precheck.ingress_class
  set_fact:
    ctlabs_kind_ingress_class: "{{ ctlabs_kind_ingress_type if ctlabs_kind_ingress_enabled else ctlabs_kind_gateway_api_provider }}"

- name: ctlabs_kind.tasks.precheck.repos
  set_fact:
    ctlabs_kind_repos: "{{ ctg_facts.ctlabs_kind.repos | default(ctlabs_kind.defaults.repos, true) }}"

- name: ctlabs_kind.tasks.precheck.charts
  set_fact:
    ctlabs_kind_charts: "{{ ctg_facts.ctlabs_kind.charts | default(ctlabs_kind.defaults.charts, true) }}"

- name: ctlabs_kind.tasks.precheck.vars
  debug:
    msg: "plane={{ ctlabs_kind_plane }}, name={{ ctlabs_kind_name }}, image={{ ctlabs_kind_image }}, nodes={{ ctlabs_kind_nodes }}, ingress_enabled={{ ctlabs_kind_ingress_enabled }}, ingress_type={{ ctlabs_kind_ingress_type }}, gateway_api_enabled={{ ctlabs_kind_gateway_api_enabled }}, gateway_api_provider={{ ctlabs_kind_gateway_api_provider }}"
