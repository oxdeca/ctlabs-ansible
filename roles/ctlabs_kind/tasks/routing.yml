---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_kind/tasks/routing.yml
# Description : Gateway API routing objects for the argocd chart when the
#               gateway_api provider is traefik (the app-side TLS secret,
#               ReferenceGrants and HTTPRoute). The Gateway object itself is
#               infra owned by the role (tasks/service.yml).
#               Manifests are rendered from templates/.
# ------------------------------------------------------------------------------

- name: ctlabs_kind.tasks.routing
  when:
    - ctlabs_kind_gateway_api_enabled
    - ctlabs_kind_gateway_api_provider == "traefik"
  environment:
    KUBECONFIG: /root/.kube/config
  block:
    - name: ctlabs_kind.tasks.routing.tls_crt
      slurp:
        src: /etc/ca-ctlabs/{{ ansible_nodename }}.crt
      register: tls_crt

    - name: ctlabs_kind.tasks.routing.tls_key
      slurp:
        src: /etc/ca-ctlabs/{{ ansible_nodename }}.prv
      register: tls_key

    - name: ctlabs_kind.tasks.routing.tls_secret
      vars:
        ctlabs_kind_tls_crt : "{{ tls_crt.content }}"
        ctlabs_kind_tls_key : "{{ tls_key.content }}"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'tls_secret.yml.j2') | from_yaml }}"

    - name: ctlabs_kind.tasks.routing.reference_grant
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'reference_grant.yml.j2') | from_yaml }}"
      register: res_route_grant
      until   : res_route_grant is success
      retries : 30
      delay   : 5

    - name: ctlabs_kind.tasks.routing.attachment_grant
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'attachment_grant.yml.j2') | from_yaml }}"

    - name: ctlabs_kind.tasks.routing.httproute
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'httproute.yml.j2') | from_yaml }}"
      register: res_route_httproute
      until   : res_route_httproute is success
      retries : 30
      delay   : 5
