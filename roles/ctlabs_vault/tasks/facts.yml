---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_vault/tasks/facts.yml
# Description : write local facts
# ------------------------------------------------------------------------------

- name: ctlabs_vault.tasks.facts.write
  when: query('ansible.builtin.fileglob', 'templates/facts.json.j2') | length > 0
  tags:
    - setup
    - ctlabs_vault.facts
  template:
    src : facts.json.j2
    dest: "{{ ctg_facts_dir }}/ctlabs_vault.fact"
    # 0600, not the template module's default -- this file can now carry a
    # declarative bootstrap.users[].password (see facts.json.j2's bootstrap
    # key), the same reason the old standalone ctlabs_vault_setup.fact was
    # 0600.
    mode: '0600'
