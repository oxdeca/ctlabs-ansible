---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_vault/tasks/precheck.yml
# Description : prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_vault.tasks.precheck
  block:
    - name: ctlabs_vault.tasks.precheck.os.supported
      assert:
        that     : ctg_os is in ctlabs_vault.os
        fail_msg : "OS[{{ ctg_os }}] is not supported!"
  rescue:
    - name: ctlabs_vault.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_vault.tasks.precheck.install_type.var
  set_fact:
    ctlabs_vault_install_type: "{{ ctlabs_vault_install_type | default('cli') }}"

- name: ctlabs_vault.tasks.precheck.install_type.local_fact
  set_fact:
    ctlabs_vault_install_type: "{{ ctg_facts.ctlabs_vault.install_type | default(ctlabs_vault_install_type) }}"

- name: ctlabs_vault.tasks.precheck.install_type.valid
  assert:
    that    : ctlabs_vault_install_type in ['cli', 'server', 'agent', 'proxy']
    fail_msg: "install_type[{{ ctlabs_vault_install_type }}] is not supported!"

- name: ctlabs_vault.tasks.precheck.server_addr
  set_fact:
    ctlabs_vault_server_addr: "{{ ctg_facts.ctlabs_vault.address | default(ctlabs_vault_server_addr) }}"
