---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_vault/defaults/main.yml
# Description : main defaults file
# ------------------------------------------------------------------------------

CMD_IP_PATH       : "{{ '/usr/sbin/ip' if ctg_os_family == 'redhat' else '/bin/ip' }}"

# agent / proxy variables
ctlabs_vault_server_addr   : "https://{{ ansible_default_ipv4.address }}:8200"
ctlabs_vault_agent_gcp_role: gce-role
ctlabs_vault_agent_cache   : false
ctlabs_vault_agent_sink    : true
ctlabs_vault_proxy_socktype: unix

# Declarative vault setup (engines/auth/policies/users/approle/jwt).
# Applied idempotently after init by tasks/bootstrap.yml (server mode only).
# Overridden per host via local fact ctlabs_vault_setup
# (/etc/ansible/facts.d/ctlabs_vault_setup.fact -> ctg_facts.ctlabs_vault_setup).
# This default mirrors the historical hard-coded init.yml bootstrap.
ctlabs_vault_setup:
  auth:
    - path       : userpass
      type       : userpass
      description: User/Pass Authentication
  policies:
    - name   : ctlabs
      source : template
      template: ctlabs.hcl.j2
  users:
    - username : ctlabs
      password : "secret123!"
      policies : ["default", "ctlabs"]

# Runtime discovery of the cluster's service-account signing key (jwt auth).
#
# This Vault cannot use oidc_discovery_url/jwks_url for it: the issuer is the
# cluster apiserver, which is not reachable from the vault host (mgmt/data VRF
# split -- the mgmt address refuses, only the data address listens) and answers
# HTTP 401 to anonymous /openid/v1/jwks. So bootstrap fetches the JWKS on the
# API node itself and injects it as jwt_validation_pubkeys (tasks/bootstrap.yml,
# jwt.jwks.*). The key is minted fresh every lab-up, which is why it is derived
# here instead of being declared in the profile.
#
# Per-profile override: jwt.validation.{host,kubeconfig,context} inside the
# bootstrap fact. The block below is only what falls back when those are absent.
ctlabs_vault_jwks:
  # kubeconfig candidates probed on the API node, first existing wins. The
  # kubeconfig is the only distro-specific input: it carries both the API base
  # URL (loopback for rke2/k3s, a published port for kind/minikube) and a client
  # certificate, which the 401 on the discovery endpoint requires.
  kubeconfigs:
    - /etc/rancher/rke2/rke2.yaml
    - /etc/rancher/k3s/k3s.yaml
    - /etc/kubernetes/admin.conf
    - /root/.kube/config
  # local-fact role names scanned for the API node when jwt.validation.host is
  # absent. The first host whose ansible_local carries one of these contributes
  # its server_node/master_node -- or itself, when that fact has no such key
  # (kind and minikube run their cluster right on the node that holds the fact).
  roles:
    - ctlabs_rke2
    - ctlabs_k3s
    - ctlabs_k8s
    - ctlabs_kind
    - ctlabs_minikube
  # interpreter for the delegated fetch. Deliberately NOT the block-level
  # `ip vrf exec default` wrapper: that belongs to the vault host's own
  # data-VRF calls, while the fetch talks to the API node's loopback from a
  # plain shell (verified live: 127.0.0.1:6443 answers there, the mgmt
  # address does not).
  interpreter: /usr/bin/python3
  timeout     : 30

# role defaults
ctlabs_vault:
  defaults:
    repos:
      redhat:
        - name: hashicorp
          type: main
          url : "https://rpm.releases.hashicorp.com/RHEL/{{ '8' if (ctg_os_version|int) < 9 else '$releasever' }}/$basearch/stable"
          key : https://rpm.releases.hashicorp.com/gpg
      debian:
        - name: hashicorp
          type: main
          url : https://apt.releases.hashicorp.com 
          key : https://apt.releases.hashicorp.com/gpg
    pkgs:
      redhat:
        - name: vault
        - name: python3-pip
        - name: python3-cryptography
        - name: gnupg2
      debian:
        - name: vault
        - name: jq
        - name: python3-pip
        - name: python3-cryptography
        - name: python3-hvac
          when: "{{ (ctg_os_version|int) > 11 }}"
        - name: gnupg
      pips:
        - hvac
    files:
      backup:
        script: vault-backup.py
        dst   : /usr/sbin/vault-backup.py
      export:
        script: vault-export.py
        dst   : /usr/sbin/vault-export.py
    config:
      dir   : /etc/vault.d
      server:
        gui      : true
        bin      : /usr/bin/vault
        data     : /opt/vault/data
        file     : vault.hcl
        template : vault.hcl.j2
        port     : 8200
        cert     : /etc/ca-ctlabs/{{ ansible_nodename }}.crt
        key      : /etc/ca-ctlabs/{{ ansible_nodename }}.prv
      agent:
        file    : vault-agent.hcl
        template: vault-agent.hcl.j2
      proxy:
        ca_cert : /etc/ca-ctlabs/ca.crt
        unix    : "/run/vault/vault.sock"
        mtls:
          uri : "{{ ansible_default_ipv4.address }}:8201"
          crt : /etc/ca-ctlabs/{{ ansible_nodename }}.crt
          key : /etc/ca-ctlabs/{{ ansible_nodename }}.prv
          ca  : /etc/ca-ctlabs/ca.crt
        file    : vault-proxy.hcl
        template: vault-proxy.hcl.j2
      init:
        url: "https://{{ ansible_default_ipv4.address }}:8200/v1"
      backup:
        # Archive passphrase (see vault-backup.py --passphrase-file): the file's
        # FIRST LINE is the passphrase, mode must be 0600 or 0400. Deliberately
        # NOT auto-generated by this role -- a passphrase nobody was told about
        # makes every archive unrecoverable. Supply it as
        # ctlabs_vault.defaults.config.backup.passphrase, or place the file
        # yourself before running the role. When absent, the timer is skipped
        # with a NOTICE rather than failing the play.
        passphrase    : ""
        passphrase_file: /etc/vault-backup.pw
        # Scheduled backup (systemd timer -> vault-backup.service). 'full' also
        # archives the config dir (/etc/vault.d: TLS cert + hcl), which a snap
        # does not -- use full so a restore comes back with working TLS.
        command       : backup-full
        on_calendar   : "*-*-* 03:17:00"
        # Spread the start so every lab's timer does not fire on the same second.
        random_delay  : 15m
        # Catch up after downtime (box off at backup time -> run at next boot).
        persistent    : true
        out_dir       : /var/backups/vault
        log_file      : /var/log/vault-backup.log
    service:
      user  : vault
      group : vault
      groups: [certs]
      server:
        name: vault.service
      agent:
        name: vault-agent.service
      proxy:
        name: vault-proxy.service
      backup:
        service: vault-backup.service
        timer  : vault-backup.timer
  os:
    - redhat9
    - centos9
    - debian11
    - debian12
