---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_hermes/defaults/main.yml
# Description : main defaults
# ------------------------------------------------------------------------------

versions:
  nodejs: node_22.x

ctlabs_hermes:
  defaults:
    pip:
      debian: pip3
      redhat: pip3.11
    repos:
      debian:
        - name: nodesource
          url : "https://deb.nodesource.com/{{ versions.nodejs }}"
          key : https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      redhat:
        - name: nodesource
          desc: NodeSource Repository
          url : "https://rpm.nodesource.com/pub_{{ versions.nodejs.split('_')[1] }}/nodistro/nodejs/$basearch"
          key : https://rpm.nodesource.com/gpgkey/ns-operations-public.key
    pkgs:
      debian:
        - name: git
        - name: curl
        - name: nodejs
        - name: python3-pip
        - name: python3.11
      redhat:
        - name: git
        - name: make
        - name: nodejs
        - name: python3-pip
        - name: python3.11
        - name: python3.11-devel
    config:
      prefdir : /etc/apt/preferences.d
      keydir  : /etc/apt/keyrings
      dir     : /home/hermes
      user    : hermes
      group   : hermes
      groups  : [certs]
      repo:
        url : https://github.com/NousResearch/hermes-agent.git
        dir : /usr/local/lib/hermes-agent
      profile:
        template: profile_hermes.sh.j2
        file    : /etc/profile.d/hermes.sh
    certs:
      dir: /etc/ca-ctlabs
      crt: "{{ ansible_nodename }}.crt"
      key: "{{ ansible_nodename }}.prv"
      ca:  ca-ctlabs.crt
  os:
    - debian12
    - kali2025
    - kali2026
    - parrot6
    - parrot7
    - centos9
