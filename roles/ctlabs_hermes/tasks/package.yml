---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_hermes/tasks/package.yml
# Description : packages
# ------------------------------------------------------------------------------

- name: ctlabs_hermes.tasks.package.redhat
  when: ctg_os_family == 'redhat'
  block:
    - name: ctlabs_hermes.tasks.package.redhat.repos.file
      yum_repository:
        name           : "{{ item.name }}"
        description    : "{{ item.desc }}"
        baseurl        : "{{ item.url  }}"
        gpgkey         : "{{ item.key  }}"
        gpgcheck       : true
        module_hotfixes: true
      loop: "{{ ctlabs_hermes.defaults.repos[ctg_os_family] }}"

- name: ctlabs_hermes.tasks.package.debian
  when: ctg_os_family == 'debian'
  block:
    - name: ctlabs_hermes.tasks.package.debian.keydir
      file:
        path : "{{ ctlabs_hermes.defaults.config.keydir }}"
        state: directory
        mode : '0755'

    - name: ctlabs_hermes.tasks.package.debian.repos.key
      get_url:
        url : "{{ item.key }}"
        dest: "{{ ctlabs_hermes.defaults.config.keydir }}/{{ item.name }}.asc"
        mode: '0644'
      loop: "{{ ctlabs_hermes.defaults.repos[ctg_os_family] }}"

    - name: ctlabs_hermes.tasks.package.debian.repos.file
      apt_repository:
        repo: "deb [signed-by={{ ctlabs_hermes.defaults.config.keydir }}/{{ item.name }}.asc] {{ item.url }} nodistro main"
        update_cache: yes
      loop: "{{ ctlabs_hermes.defaults.repos[ctg_os_family] }}"

    - name: ctlabs_hermes.tasks.package.debian.nodejs.pin
      template:
        src : nodejs.pref.j2
        dest: "{{ ctlabs_hermes.defaults.config.prefdir }}/{{ item.name }}.pref"
        mode: '0644'
        owner: root
        group: root
      loop: "{{ ctlabs_hermes.defaults.repos[ctg_os_family] }}"
      notify: ctlabs_hermes.handlers.apt.update_cache

    - name: ctlabs_hermes.tasks.package.debian.update.cache
      apt:
        update_cache: true

- name: ctlabs_hermes.tasks.package.pkgs.installed
  when: item.when is not defined or item.when
  package:
    name  : "{{ item.name }}"
    state : present
  loop    : "{{ ctlabs_hermes.defaults.pkgs[ctg_os_family] }}"
  register: result
  until   : result is success

- name: ctlabs_hermes.tasks.package.repo.clone
  git:
    repo  : "{{ ctlabs_hermes.defaults.config.repo.url }}"
    dest  : "{{ ctlabs_hermes.defaults.config.repo.dir }}"
    depth : 1
    version: main
    force: true

- name: ctlabs_hermes.tasks.package.install
  pip:
    name       : "{{ ctlabs_hermes.defaults.config.repo.dir }}"
    editable   : true
    state      : present
    executable : "{{ ctlabs_hermes.defaults.pip[ctg_os_family] }}"
