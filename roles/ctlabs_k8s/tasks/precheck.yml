---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_k8s/tasks/precheck.yml
# Description : tasks prechecks
# ------------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.precheck
  block:
    - name: ctlabs_k8s.tasks.precheck.os.supported
      assert:
        that: ctg_os is in ctlabs_k8s.os
        fail_msg: "OS [{{ ctg_os }}] is not supported!"
    
    - name: ctlabs_k8s.tasks.precheck.virtype
      assert:
        that     : ctg_virtype is in ctlabs_k8s.virtype
        fail_msg : "Virtualization Type '{{ ctg_virtype }}' not supported!"
  rescue:
    - name: ctlabs_k8s.tasks.precheck.skip.unsupported
      meta: end_host

#
# Kernel
#
- name: ctlabs_k8s.tasks.precheck.kernel.modules.load
  modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ ctlabs_k8s.defaults.config.kernel.modules }}"

- name: ctlabs_k8s.tasks.precheck.kernel.modules.file
  copy:
    content: "{{ ctlabs_k8s.defaults.config.kernel.modules | join('\n') }}"
    dest   : "{{ ctlabs_k8s.defaults.config.kernel.modules_file }}"

- name: ctlabs_k8s.tasks.precheck.kernel.params
  template:
    src  : "{{ ctlabs_k8s.defaults.config.kernel.params.template }}"
    dest : "{{ ctlabs_k8s.defaults.config.kernel.params.file     }}"

- name: ctlabs_k8s.tasks.preckeck.kernel.params.reload
  command: "sysctl --system"

#
# system
#
- name: ctlabs_k8s.tasks.precheck.hosts
  blockinfile:
    path  : /etc/hosts
    block: |
      {{ ansible_default_ipv4.address }}  {{ ansible_nodename }}.local {{ ansible_nodename }} {{ ansible_nodename.split('.')[0] }} kubernetes

#
# node role
#
- name: ctlabs_k8s.tasks.precheck.role.var
  set_fact:
    ctlabs_k8s_role: "{{ ctlabs_k8s_role | default(ctlabs_k8s.defaults.config.role) }}"

- name: ctlabs_k8s.tasks.precheck.role.local_fact
  set_fact:
    ctlabs_k8s_role: "{{ ctg_facts.ctlabs_k8s.role | default(ctlabs_k8s_role) }}"

- name: ctlabs_k8s.tasks.precheck.role.supported
  assert:
    that    : ctlabs_k8s_role in ['master', 'control', 'worker']
    fail_msg: "Role [{{ ctlabs_k8s_role }}] not supported! Valid: master, control, worker"

#
# storage engine (cluster-wide, decided by the master only)
#
- name: ctlabs_k8s.tasks.precheck.storage.fact
  set_fact:
    ctlabs_k8s_storage: "{{ (ctg_facts.ctlabs_k8s.storage | default('') | trim | lower) or (ctlabs_k8s.defaults.config.storage.engine if ctlabs_k8s_role == 'master' else none) }}"

- name: ctlabs_k8s.tasks.precheck.storage.master_only
  assert:
    that    : ctlabs_k8s_storage is none or ctlabs_k8s_role == 'master'
    fail_msg: "Storage engine is a cluster-wide choice, decided by the master only. Remove 'storage: {{ ctlabs_k8s_storage }}' from host [{{ inventory_hostname }}] (role {{ ctlabs_k8s_role }}) and set it on the master instead."

#
# join (control / worker)
#
- name: ctlabs_k8s.tasks.precheck.join
  when: ctlabs_k8s_role in ['control', 'worker']
  block:
    - name: ctlabs_k8s.tasks.precheck.join.master_node
      set_fact:
        ctlabs_k8s_master_node: "{{ ctg_facts.ctlabs_k8s.master_node }}"

    - name: ctlabs_k8s.tasks.precheck.join.master_ip
      set_fact:
        ctlabs_k8s_master_ip: "{{ ctg_facts.ctlabs_k8s.master_ip | default(ctlabs_k8s_master_ip) }}"

    - name: ctlabs_k8s.tasks.precheck.join.master.ready
      wait_for:
        host   : "{{ ctlabs_k8s_master_ip }}"
        port   : 6443
        state  : started
        timeout: 600
        delay  : 10

    - name: ctlabs_k8s.tasks.precheck.join.data.get
      slurp:
        src: "{{ ctlabs_k8s.defaults.config.dirs.main }}/{{ ctlabs_k8s.defaults.config.join_data.file.split('/')[-1] }}"
      delegate_to: "{{ ctlabs_k8s_master_node }}"
      register   : k8s_join_data
      until      : k8s_join_data is success
      retries    : 60
      delay      : 5

    - name: ctlabs_k8s.tasks.precheck.join.data.facts
      set_fact:
        ctlabs_k8s_join_apiserver: "{{ (k8s_join_data.content | b64decode | from_yaml).api_server }}"
        ctlabs_k8s_join_token    : "{{ (k8s_join_data.content | b64decode | from_yaml).token }}"
        ctlabs_k8s_join_ca_hash  : "{{ (k8s_join_data.content | b64decode | from_yaml).ca_cert_hash }}"
        ctlabs_k8s_join_cert_key : "{{ (k8s_join_data.content | b64decode | from_yaml).certificate_key }}"
