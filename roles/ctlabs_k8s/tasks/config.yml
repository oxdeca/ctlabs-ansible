---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_k8s/tasks/config.yml
# Description : main configurations
#
# Node roles (resolved in precheck -> ctlabs_k8s_role):
#   master  : initial control plane — runs `kubeadm init --upload-certs`, writes
#             the join payload, installs CNI (calico), approves kubelet CSRs.
#   control : additional control plane — `kubeadm join --control-plane` using the
#             certificate-key from the master.
#   worker  : `kubeadm join`.
# ------------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.crictl.config
  template:
    src  : "{{ ctlabs_k8s.defaults.config.crictl.template }}"
    dest : "{{ ctlabs_k8s.defaults.config.crictl.file     }}"

- name: ctlabs_k8s.tasks.config.dirs
  file:
    path : "{{ item.value }}"
    state: directory
    mode : '0755'
  loop: "{{ ctlabs_k8s.defaults.config.dirs | dict2items }}"

- name: ctlabs_k8s.tasks.config.components
  template:
    src  : "{{ item.template }}"
    dest : "{{ ctlabs_k8s.defaults.config.dirs.components }}/{{ item.file }}"
    mode : '0644'
  loop: "{{ ctlabs_k8s.defaults.config.components }}"
  register: k8s_config_components
  until   : k8s_config_components is success
  retries : 10
  delay   : 5

- name: ctlabs_k8s.tasks.config.profile.d
  template:
    src  : "{{ ctlabs_k8s.defaults.config.profile.template }}"
    dest : "{{ ctlabs_k8s.defaults.config.profile.file     }}"

# -----------------------------------------------------------------------------
# join nodes (control / worker)
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.join
  when: ctlabs_k8s_role in ['control', 'worker']
  block:
    - name: ctlabs_k8s.tasks.config.join.render
      template:
        src  : "{{ ctlabs_k8s.defaults.config.join.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.dirs.main }}/{{ ctlabs_k8s.defaults.config.join.file }}"
        mode : '0600'

    - name: ctlabs_k8s.tasks.config.join.run
      command: "/usr/bin/kubeadm join --config {{ ctlabs_k8s.defaults.config.dirs.main }}/{{ ctlabs_k8s.defaults.config.join.file }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

# -----------------------------------------------------------------------------
# master (initial control plane)
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.master
  when: ctlabs_k8s_role == 'master'
  block:
    - name: ctlabs_k8s.tasks.config.secrets.stat
      stat:
        path: "{{ ctlabs_k8s.defaults.config.secrets.file }}"
      register: k8s_secrets_stat

    - name: ctlabs_k8s.tasks.config.secrets.create
      when: not k8s_secrets_stat.stat.exists
      copy:
        dest   : "{{ ctlabs_k8s.defaults.config.secrets.file }}"
        content: |
          token: "{{ query('community.general.random_string', override_all='0123456789abcdef', length=6)[0] }}.{{ query('community.general.random_string', override_all='0123456789abcdef', length=16)[0] }}"
          certificate_key: "{{ query('community.general.random_string', override_all='0123456789abcdef', length=64)[0] }}"
        mode   : '0640'

    - name: ctlabs_k8s.tasks.config.secrets.get
      slurp:
        src: "{{ ctlabs_k8s.defaults.config.secrets.file }}"
      register: k8s_secrets

    - name: ctlabs_k8s.tasks.config.secrets.facts
      set_fact:
        ctlabs_k8s_join_token: "{{ (k8s_secrets.content | b64decode | from_yaml).token }}"
        ctlabs_k8s_cert_key  : "{{ (k8s_secrets.content | b64decode | from_yaml).certificate_key }}"

    - name: ctlabs_k8s.tasks.config.kubeadm-init
      template:
        src  : "{{ ctlabs_k8s.defaults.config.init.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.dirs.main }}/{{ ctlabs_k8s.defaults.config.init.file }}"
        mode : '0600'

    - name: ctlabs_k8s.tasks.config.kubeadm-init.run
      command: "/usr/bin/kubeadm init --config {{ ctlabs_k8s.defaults.config.dirs.main }}/{{ ctlabs_k8s.defaults.config.init.file }} --upload-certs"
      args:
        creates: /etc/kubernetes/admin.conf

    - name: ctlabs_k8s.tasks.config.ca.hash
      shell: >
        openssl x509 -pubkey
        -in {{ ctlabs_k8s.defaults.config.dirs.main }}/pki/ca.crt
        | openssl rsa -pubin -outform der 2>/dev/null
        | openssl dgst -sha256 -hex
        | sed 's/^.* //'
      register: k8s_ca_hash

    - name: ctlabs_k8s.tasks.config.ca.hash.fact
      set_fact:
        ctlabs_k8s_join_ca_hash: "{{ k8s_ca_hash.stdout | trim }}"

    - name: ctlabs_k8s.tasks.config.join_data
      template:
        src  : "{{ ctlabs_k8s.defaults.config.join_data.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.join_data.file }}"
        mode : '0640'

    - name: ctlabs_k8s.tasks.config.manifests
      template:
        src  : "{{ item.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.dirs.manifests }}/{{ item.file }}"
        mode : '0644'
      loop: "{{ ctlabs_k8s.defaults.config.manifests }}"

# -----------------------------------------------------------------------------
# Calico (master only)
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.calico
  when: ctlabs_k8s_role == 'master'
  block:
    - name: ctlabs_k8s.tasks.config.calico.download-operator
      get_url:
        url  : "{{ ctlabs_k8s.defaults.cluster.calico.url }}"
        dest : "{{ ctlabs_k8s.defaults.config.dirs.components }}/calico.yml"

    - name: ctlabs_k8s.tasks.config.calico.install-operator
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl apply -f {{ ctlabs_k8s.defaults.config.dirs.components }}/calico.yml"

    - name: ctlabs_k8s.tasks.config.calico.wait-for-crd
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl wait --for=condition=established --timeout=60s crd/installations.operator.tigera.io"
      register: crd_wait
      until: crd_wait is success
      retries: 5
      delay: 3

    - name: ctlabs_k8s.tasks.config.calico.custom-resources
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl apply -f {{ ctlabs_k8s.defaults.config.dirs.components }}/custom-resources.yml"

# -----------------------------------------------------------------------------
# Approve Certs (master only)
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.certs
  when: ctlabs_k8s_role == 'master'
  block:
    # Worker kubelet-serving CSRs arrive LATE (after a node joins). Poll a few
    # minutes so late CSRs are caught; otherwise kubectl logs/exec fails with
    # "remote error: tls: internal error" (Pending csr for that node).
    - name: ctlabs_k8s.tasks.config.certs.list
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl get csr --field-selector spec.signerName=kubernetes.io/kubelet-serving -o name"
      register: certs
      changed_when: false

    - name: ctlabs_k8s.tasks.config.certs.approve
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl certificate approve {{ item }}"
      loop: "{{ certs.stdout_lines }}"
      when: certs.stdout_lines | length > 0

    # Kubelet-serving CSRs arrive LATE (after each node joins). Re-poll for a
    # couple of minutes and approve late/rotated CSRs; otherwise kubectl
    # logs/exec fails with "tls: internal error" while the CSR sits Pending.
    - name: ctlabs_k8s.tasks.config.certs.late
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      shell: |
        pending=$(/usr/bin/kubectl get csr --field-selector spec.signerName=kubernetes.io/kubelet-serving --no-headers | awk '$NF != "Approved,Issued" {print $1}')
        if [ -n "$pending" ]; then
          /usr/bin/kubectl certificate approve $pending >/dev/null 2>&1
        fi
        /usr/bin/kubectl get csr --field-selector spec.signerName=kubernetes.io/kubelet-serving --no-headers | awk '$NF != "Approved,Issued"' | wc -l
      args:
        executable: /bin/bash
      register: certs_late
      changed_when: false
      until: (certs_late.stdout | trim | int) == 0
      retries: 12
      delay: 10

# -----------------------------------------------------------------------------
# kubelet-serving CSR auto-approver (master only)
#
# The in-play polls above still miss kubelet-serving CSRs from nodes that join
# long after this play finishes (kubectl logs/exec => "tls: internal error").
# Install a systemd timer that approves any pending kubelet-serving CSR every
# minute, forever — self-healing on every rebuild.
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.certs.approver
  when: ctlabs_k8s_role == 'master'
  block:
    - name: ctlabs_k8s.tasks.config.certs.approver.script
      template:
        src  : "{{ ctlabs_k8s.defaults.config.csr_approver.script.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.csr_approver.script.file }}"
        mode : '0700'

    - name: ctlabs_k8s.tasks.config.certs.approver.service
      template:
        src  : "{{ ctlabs_k8s.defaults.config.csr_approver.service.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.csr_approver.service.file }}"
        mode : '0644'

    - name: ctlabs_k8s.tasks.config.certs.approver.timer
      template:
        src  : "{{ ctlabs_k8s.defaults.config.csr_approver.timer.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.csr_approver.timer.file }}"
        mode : '0644'

    - name: ctlabs_k8s.tasks.config.certs.approver.enable
      systemd:
        name           : k8s-csr-approver.timer
        state          : started
        enabled        : true
        daemon_reload  : true

# -----------------------------------------------------------------------------
# Storage (master only)
#
# Engine resolved in precheck (ctlabs_k8s_storage); validated to be a
# master-only declaration there. Values:
#   local   : minimal node-local dynamic PV (rancher/local-path-provisioner),
#             a single Deployment + default StorageClass on every node.
#   longhorn: provisioned out-of-band via the ctlabs_helm 'longhorn' chart
#             (opt-in labs). No-op here.
#   none    : no storage engine is deployed on this cluster.
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.storage
  when: ctlabs_k8s_role == 'master'
  block:
    - name: ctlabs_k8s.tasks.config.storage.local.manifest
      when: ctlabs_k8s_storage == 'local'
      template:
        src  : "{{ ctlabs_k8s.defaults.config.storage.manifest.template }}"
        dest : "{{ ctlabs_k8s.defaults.config.dirs.components }}/{{ ctlabs_k8s.defaults.config.storage.manifest.file }}"

    - name: ctlabs_k8s.tasks.config.storage.local.apply
      when: ctlabs_k8s_storage == 'local'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl apply -f {{ ctlabs_k8s.defaults.config.dirs.components }}/{{ ctlabs_k8s.defaults.config.storage.manifest.file }}"

# -----------------------------------------------------------------------------
# Gateway API (master only)
#
# Cluster-wide infrastructure; apps attach via the ctlabs_helm chart-level
# `gateway` key (HTTPRoute + TLS secret + ReferenceGrants), like k3s/rke2.
# The role installs the Gateway API CRDs and owns the shared Gateway object.
# Traefik serves both Ingress and Gateway API routes concurrently; the gateway
# provider (providers.kubernetesGateway) is enabled in the traefik chart.
# -----------------------------------------------------------------------------

- name: ctlabs_k8s.tasks.config.gateway_api
  when:
    - ctlabs_k8s_role == 'master'
    - ctlabs_k8s_gateway_api_enabled | bool
  block:
    - name: ctlabs_k8s.tasks.config.gateway_api.crds.download
      get_url:
        url : "{{ ctlabs_k8s.defaults.config.gateway_api.crds.url }}"
        dest: "{{ ctlabs_k8s.defaults.config.gateway_api.crds.file }}"

    - name: ctlabs_k8s.tasks.config.gateway_api.crds.apply
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "/usr/bin/kubectl apply --server-side -f {{ ctlabs_k8s.defaults.config.gateway_api.crds.file }}"
      register: gw_crds
      until: gw_crds is success
      retries: 3
      delay: 5

    - name: ctlabs_k8s.tasks.config.gateway_api.namespace
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      kubernetes.core.k8s:
        kind : Namespace
        name : "{{ ctlabs_k8s.defaults.config.gateway_api.gateway.namespace }}"
        state: present

    - name: ctlabs_k8s.tasks.config.gateway_api.gateway_class
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      kubernetes.core.k8s:
        state     : present
        definition: "{{ lookup('template', 'gatewayclass.yml.j2') | from_yaml }}"

    - name: ctlabs_k8s.tasks.config.gateway_api.gateway
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      kubernetes.core.k8s:
        state     : present
        definition: "{{ lookup('template', 'gateway.yml.j2') | from_yaml }}"
