---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_k8s/defaults/main.yml
# Description : main defaults
# ------------------------------------------------------------------------------

versions :
  k8s            : 1.36.4
  calico         : 3.32.2
  prometheus     : 0.10
  metrics_server : 0.7.0
  gateway_api    : 1.5.1

ctlabs_k8s_join_token: "{{ query('community.general.random_string', override_all='0123456789abcdef', length=6)[0] }}.{{ query('community.general.random_string', override_all='01234567890abcdef', length=16)[0] }}"
ctlabs_k8s_cert_key  : "{{ query('community.general.random_string', override_all='0123456789abcdef', length=64)[0] }}"
ctlabs_k8s_master_ip : "{{ ansible_default_ipv4.address }}"
# Pod network. MUST be large enough for kubeadm to hand each node its own /24
# (kubeadm derives per-node podCIDRs from this). A /24 only fits ONE node → other
# nodes get no podCIDR → calico cross-node routes break ('dev lo' loops, pod-to-pod
# dead). Single-node labs work with anything; multi-node needs at least a /16.
ctlabs_k8s_pod_cidr  : 10.8.0.0/16
# Calico tunnel: use IPIP (tunl0) rather than VXLANCrossSubnet. On HA labs kube-vip
# puts its VIP (192.168.30.x/32) on every node's lo; under VXLANCrossSubnet calico
# then programs peer podCIDR routes `via <peer-ip> dev lo onlink` → cross-node pod
# traffic dies (metallb/webhook timeouts, argocd `helm install --wait` hangs on any
# pod on another node). IPIP tunnels unconditionally through tunl0 and is immune.
ctlabs_k8s_pod_cidr_encapsulation : "IPIP"
ctlabs_k8s_prometheus: false

ctlabs_k8s:
  defaults:
    cluster:
      k8s: 
        version: "{{ versions.k8s }}"
      calico:
        url    : "https://raw.githubusercontent.com/projectcalico/calico/v{{ versions.calico }}/manifests/tigera-operator.yaml"
      metrics_server:
        url    : "https://github.com/kubernetes-sigs/metrics-server/releases/download/v{{ versions.metrics_server }}/components.yaml"
      prometheus:
        url    : "https://github.com/prometheus-operator/kube-prometheus/archive/refs/heads/release-{{ versions.prometheus }}.zip"
    repos:
      debian:
        - name: kubernetes
          type: /
          url : "https://pkgs.k8s.io/core:/stable:/v{{ (versions.k8s).split('.')[:2]|join('.') }}/deb/"
          key : "https://pkgs.k8s.io/core:/stable:/v{{ (versions.k8s).split('.')[:2]|join('.') }}/deb/Release.key"
      redhat:
    pkgs:
      redhat:
      debian:
        - name : apt-transport-https
        - name : python3-pip
        - name : python3-openshift
        - name : python3-kubernetes
        - name : open-iscsi
        - name : nfs-common
        - name : etcd-client
        - name : protobuf-compiler
        - name : kubelet
        - name : kubeadm
        - name : kubectl
      python:
        pips: []
    scripts:
      versions:
        template: versions.sh.j2
        file    : /opt/k8sver
      k8sall:
        template: k8sall.sh.j2
        file    : /usr/local/bin/k8s-all
    config:
      role       : master                  # one of: master (initial control plane), control (additional control plane), worker
      profile:
        template: ctlabs_k8s.sh.j2
        file    : /etc/profile.d/ctlabs_k8s.sh
      secrets:
        file    : /etc/kubernetes/ctlabs_k8s_secrets.yml
      join_data:
        file    : /etc/kubernetes/ctlabs_k8s_join.yml
        template: join-data.yml.j2
      kernel:
        params:
          file    : /etc/sysctl.d/99-k8s.conf
          template: 99-k8s.conf.j2
        modules:
          - br_netfilter
          - overlay
        modules_file: /etc/modules-load.d/ctlabs_k8s.conf
      apt_keys: /etc/apt/keyrings
      dirs:
        main      : /etc/kubernetes
        manifests : /etc/kubernetes/manifests
        components: /etc/kubernetes/components
      crictl:
        file    : /etc/crictl.yaml
        template: crictl.yaml.j2
      init:
        file    : kubeadm-init.yml
        template: kubeadm-init.yml.j2
      join:
        file    : kubeadm-join.yml
        template: kubeadm-join.yml.j2
      manifests:
        - name    : kube-vip
          file    : kube-vip.yml
          template: kube-vip.yml.j2
      components:
        - name    : calico
          file    : custom-resources.yml
          template: calico-custom-resources.yml.j2
        - name    : flannel
          file    : flannel.yml
          template: flannel.yml.j2
        - name    : weave
          file    : weave.yml
          template: weave.yml.j2
      storage:
        engine    : local          # storage engine: local (default) | longhorn | none
        local:
          namespace   : kube-system
          version     : v0.0.31
          data_dir    : /media/vols
          helper_image: busybox:latest
        manifest:
          file    : local-path-provisioner.yml
          template: local-path-provisioner.yml.j2

      pid_cidr        : 172.31.0.0/16
      kube_vip        : false
      # Services LoadBalancer provider — exactly ONE may be active at a time.
      #   kube-vip : host-IP LB (k3s/klipper style). kube-vip already runs on the
      #              master for the apiserver VIP (.31); LoadBalancer services are
      #              served on that node IP, so the app host name
      #              (k8s1.ctlabs.internal) works directly — no extra controller.
      #   metallb  : pool-based LB, deployed by the ctlabs_helm profile (opt-in);
      #              kube-vip then stays control-plane-VIP only.
      #   none     : no services LB at all.
      lb              : kube-vip
      lb_supported    : ['kube-vip', 'metallb', 'none']
      schedule_master : false
      network         : calico
      prometheus      : false
      pgsql_op        : none
      pgsql_opns      : default

      # Gateway API (cluster-wide, decided by the master only). The role owns the
      # infrastructure (CRDs + GatewayClass + Gateway object, ctlabs_k8s/tasks/config.yml);
      # app wiring (TLS secret, ReferenceGrants, HTTPRoute) rides with the app's chart
      # in ctlabs_helm via the chart-level `gateway` key — same model as k3s/rke2.
      gateway_api:
        enabled : true            # actual default per host via ctg_facts.ctlabs_k8s.gateway_api
        provider: "traefik"       # Options: 'traefik'
        crds:
          url : "https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{ versions.gateway_api }}/standard-install.yaml"
          file: "/etc/kubernetes/gateway-api-crds.yml"
        gateway:
          name       : traefik-gateway
          namespace  : traefik
          class      : traefik
          class_controller: "traefik.io/gateway-controller"
          tls_secret : argocd-tls
          tls_secret_ns: argo
          listeners:
            web:
              port: 8000
            websecure:
              port: 8443
    service:
      name: kubelet.service
    bin:
      path: /usr/bin/k3s
      mode: '0750'
  os:
    - rhel8
    - centos8
    - centos9
    - debian12
  virtype:
    - kvm
