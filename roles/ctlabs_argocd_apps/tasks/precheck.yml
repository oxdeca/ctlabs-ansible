---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_argocd_apps/tasks/precheck.yml
# Description : tasks prechecks
#
# Resolves the per-host local fact (ctg_facts.ctlabs_argocd_apps) against the
# role defaults, then validates the application list.
# ------------------------------------------------------------------------------

- name: ctlabs_argocd_apps.tasks.precheck
  block:
    - name: ctlabs_argocd_apps.tasks.precheck.os.supported
      assert:
        that: ctg_os is in ctlabs_argocd_apps.os
        fail_msg: "OS[{{ctg_os}}] is not supported!"
  rescue:
    - name: ctlabs_argocd_apps.tasks.precheck.skip.unsupported
      meta: end_host

- name: ctlabs_argocd_apps.tasks.precheck.fact
  set_fact:
    ctlabs_argocd_apps_fact: "{{ (ctg_facts | default({}, true)).ctlabs_argocd_apps | default({}, true) }}"

#
# resolution chain: local fact -> role default
#
# plain `| default(...)` (no `true`), not `| default(..., true)`: the boolean
# form also substitutes on a DEFINED but falsey value, which would silently
# override the documented opt-outs (finalizers: [], wait: false) with the
# defaults. Only an absent key may fall through.
#
- name: ctlabs_argocd_apps.tasks.precheck.resolve
  set_fact:
    ctlabs_argocd_apps_applications : "{{ ctlabs_argocd_apps_fact['applications'] | default(ctlabs_argocd_apps.defaults.applications) }}"
    ctlabs_argocd_apps_kubeconfig   : "{{ ctlabs_argocd_apps_fact['kubeconfig']   | default(ctlabs_argocd_apps.defaults.kubeconfig) }}"
    ctlabs_argocd_apps_interpreter  : "{{ ctlabs_argocd_apps_fact['interpreter']  | default(ctlabs_argocd_apps.defaults.interpreter) }}"
    ctlabs_argocd_apps_namespace    : "{{ ctlabs_argocd_apps_fact['namespace']    | default(ctlabs_argocd_apps.defaults.namespace) }}"
    ctlabs_argocd_apps_project      : "{{ ctlabs_argocd_apps_fact['project']      | default(ctlabs_argocd_apps.defaults.project) }}"
    ctlabs_argocd_apps_server       : "{{ ctlabs_argocd_apps_fact['server']       | default(ctlabs_argocd_apps.defaults.server) }}"
    ctlabs_argocd_apps_sync_policy  : "{{ ctlabs_argocd_apps_fact['sync_policy']  | default(ctlabs_argocd_apps.defaults.sync_policy) }}"
    ctlabs_argocd_apps_finalizers   : "{{ ctlabs_argocd_apps_fact['finalizers']   | default(ctlabs_argocd_apps.defaults.finalizers) }}"
    ctlabs_argocd_apps_crd_wait     : "{{ ctlabs_argocd_apps_fact['crd_wait']     | default(ctlabs_argocd_apps.defaults.crd_wait) | int }}"
    ctlabs_argocd_apps_wait         : "{{ ctlabs_argocd_apps_fact['wait']         | default(ctlabs_argocd_apps.defaults.wait) }}"
    ctlabs_argocd_apps_wait_timeout : "{{ ctlabs_argocd_apps_fact['wait_timeout'] | default(ctlabs_argocd_apps.defaults.wait_timeout) | int }}"

- name: ctlabs_argocd_apps.tasks.precheck.wait_delay
  set_fact:
    ctlabs_argocd_apps_wait_delay: "{{ [ctlabs_argocd_apps.defaults.wait_delay, ctlabs_argocd_apps_wait_timeout | int] | min | int }}"

#
# 'source' is opaque to this role, but these three fields are required by
# ArgoCD itself for any application, so catching them here beats a cryptic
# 'InvalidApplicationSpec' from the API server later.
#
- name: ctlabs_argocd_apps.tasks.precheck.applications.spec
  assert:
    that:
      - "'name' in app"
      - "'source' in app"
      - "app['source'] is mapping"
      - "'repoURL' in app['source']"
    fail_msg: >-
      Application[{{ app | to_json }}] needs 'name' and a 'source' mapping
      containing at least 'repoURL' (plus exactly one of chart/path/directory/
      kustomize/plugin, per ArgoCD's spec.source).
  loop: "{{ ctlabs_argocd_apps_applications }}"
  loop_control:
    loop_var: app

- name: ctlabs_argocd_apps.tasks.precheck.helm.charts
  set_fact:
    ctlabs_argocd_apps_helm_charts: "{{ ((ctg_facts | default({}, true)).ctlabs_helm | default({}, true)).charts | default([], true) }}"

#
# Helm and ArgoCD must never manage the same release: both would keep
# reverting each other and the app goes permanently OutOfSync with no obvious
# cause. This is a config error on both sides, so fail loudly rather than
# silently dropping one of them.
#
- name: ctlabs_argocd_apps.tasks.precheck.helm.conflict.fact
  set_fact:
    ctlabs_argocd_apps_conflicts: >-
      {{
        (ctlabs_argocd_apps_helm_charts    | map(attribute='name') | map('lower') | list)
        | intersect(
            ctlabs_argocd_apps_applications | map(attribute='name') | map('lower') | list
          )
      }}

- name: ctlabs_argocd_apps.tasks.precheck.helm.conflict
  when: ctlabs_argocd_apps_applications | length > 0
  assert:
    that:
      - ctlabs_argocd_apps_conflicts | length == 0
    fail_msg: >-
      [{{ ctlabs_argocd_apps_conflicts | join(', ') }}] is declared BOTH as a
      ctlabs_helm chart and as an ArgoCD application. Helm and ArgoCD would
      fight over the same resources forever. Keep it in one place only.
