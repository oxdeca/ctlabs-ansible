---

# ------------------------------------------------------------------------------
# File        : ctlabs-ansible/roles/ctlabs_argocd_apps/tasks/facts.yml
# Description : write local facts
# ------------------------------------------------------------------------------

- name: ctlabs_argocd_apps.tasks.facts.write
  when: query('ansible.builtin.fileglob', 'templates/facts.json.j2') | length > 0
  tags:
    - setup
    - ctlabs_argocd_apps.facts
  template:
    src : facts.json.j2
    dest: "{{ ctg_facts_dir }}/ctlabs_argocd_apps.fact"
