---

# -----------------------------------------------------------------------------------------------------------
# File        : ctlabs-ansible/playbooks/setup.yml
# Description : ctlabs setup
# -----------------------------------------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# ctg_facts
# -----------------------------------------------------------------------------
- name  : ctlabs.playbooks.setup
  hosts : all:!rhosts
  tags  : setup
  tasks :
    - name: ctlabs.playbooks.ctlabs.setup.local_facts.dir
      file:
        path : "{{ ctg_facts_dir }}"
        state: directory

# -----------------------------------------------------------------------------
# ctlabs_ca
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.ca
  hosts: all:!rhosts
  tags : setup
  tasks:
    - name: ctlabs.playbooks.ctlabs.setup.ca.local_facts
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_ca.fact"
        content: |
          {
            "domain" : "{{ CTLABS_DOMAIN }}"
          }

# -----------------------------------------------------------------------------
# ctlabs_bind
# -----------------------------------------------------------------------------
- name: ctlabs.playbooks.setup.bind
  hosts: ns1,ns2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.bind.master.local_facts
      when: ctg_host == 'ns1'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_bind.fact"
        content: |
          {
            "role"   : "server",
            "type"   : "master",
            "zones"  : [
              { "name" : "{{ CTLABS_DOMAIN }}" }, 
              { "name" : "ctlabs.internal" }, 
              { "name" : "svc.ctlabs.internal", "ddns" : { "allow" : [ "127.0.0.1" ] } },
              { "name" : "ad.ctlabs.internal", "type" : "forward", "forwarders" : [ "192.168.10.14" ] }
            ],
            "slaves" : [ "192.168.20.11" ]
          }

    - name: ctlabs.playbooks.setup.bind.slave.local_facts
      when: ctg_host == 'ns2'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_bind.fact"
        content: |
          {
            "role"    : "server",
            "type"    : "slave",
            "zones"  : [
              { "name" : "{{ CTLABS_DOMAIN }}" }, 
              { "name" : "ctlabs.internal" }, 
              { "name" : "svc.ctlabs.internal", "ddns" : { "allow" : [ "127.0.0.1" ] } },
              { "name" : "ad.ctlabs.internal", "type" : "forward", "forwarders" : [ "192.168.10.14" ] }
            ],
            "masters" : [ "192.168.10.11" ]
          }

# -----------------------------------------------------------------------------
# ctlabs_smbadc
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.smbadc
  hosts: dc1,dc2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.smbadc.master.local_facts
      when: ctg_host == 'dc1'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_smbadc.fact"
        content: |
          {
            "role"   : "master",
            "domain" : "ad.{{ CTLABS_DOMAIN }}"
          }

    - name: ctlabs.playbooks.setup.smbadc.slave.local_facts
      when: ctg_host == 'dc2'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_smbadc.fact"
        content: |
          {
            "role"   : "slave",
            "domain" : "ad.{{ CTLABS_DOMAIN }}",
            "master" : "dc1.ad.{{ CTLABS_DOMAIN }}"
          }

# -----------------------------------------------------------------------------
# ctlabs_slapd
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.slapd
  hosts: slapd1,slapd2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.slapd.local_facts
      when: ctg_host in [ 'slapd1', 'slapd2']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_slapd.fact"
        content: |
          {
            "dbs" : [{
              "type"        : "ldap",
              "suffix"      : "dc=ad,dc={{ CTLABS_DOMAIN|split('.')|join(',dc=') }}",
              "uri"         : "ldaps://dc2.{{ CTLABS_DOMAIN }} ldaps://dc1.{{ CTLABS_DOMAIN }}",
              "bind_method" : "simple",
              "bind_user"   : "cn=slapd,ou=services,dc=ad,dc={{ CTLABS_DOMAIN|split('.')|join(',dc=') }}",
              "bind_pass"   : "secret123!"
            }]
          }

# -----------------------------------------------------------------------------
# ctlabs_alloy
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.alloy
  hosts: mail1,mail2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.alloy.local_facts
      when: ctg_host in ['mail1', 'mail2']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_alloy.fact"
        content: |
          {
            "config" : {
              "email_archive" : true
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_promtail
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.promtail
  hosts: mail1,mail2,prometheus
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.promtail.local_facts
      when: ctg_host in ['mail1', 'mail2']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_promtail.fact"
        content: |
          {
            "config" : {
              "email_archive" : true
            }
          }

    - name: ctlabs.playbooks.setup.promtail.local_facts
      when: ctg_host == 'prometheus'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_promtail.fact"
        content: |
          {
            "config" : {
              "goflow2" : true
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_prometheus
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.prometheus
  hosts: prometheus
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.prometheus.local_facts
      when: ctg_host == 'prometheus'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_prometheus.fact"
        content: |
          {
            "mode"   : "agent",
            "config" : {
              "node_exporter"     : true,
              "blackbox_exporter" : true,
              "goflow2"           : true,
              "remote_write"      : {
                "uri" : "https://mimir.ctlabs.internal:9009/api/v1/push"
              }
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_openvpn
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.openvpn
  hosts: ro1,ro2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.openvpn.server.local_facts
      when: ctg_host == 'ro1'
      copy:
        dest: "{{ ctg_facts_dir }/ctlabs_openvpn.fact"
        content: |
          {
            "type"      : "server",
            "server_ip" : "10.8.15.1",
            "client_ip" : "10.8.15.2"
          }

    - name: ctlabs.playbooks.setup.openvpn.client.local_facts
      when: ctg_host == 'ro2'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_openvpn.fact"
        content: |
          {
            "type"      : "client",
            "server_ip" : "10.8.15.1",
            "client_ip" : "10.8.15.2",
            "remote"    : "192.168.16.2"
          }

# -----------------------------------------------------------------------------
# ctlabs_frr
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.frr
  hosts: ro1,ro2,ro3,ro4,isp1
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.frr.local_facts
      when: ctg_host == 'ro1'
      copy:
        dest: "{{ ctg_facts_dir }/ctlabs_frr.fact"
        content: |
          {
            "daemons" : { 
              "enabled" : [ "bgpd", "ospfd" ],
              "profile" : "datacenter"
            },
            "router" : {
              "bgp" : {
                "local_asn"  : "65001",
                "local_ip"   : "10.8.15.1",
                "remote_ip"  : "10.8.15.2",
                "remote_asn" : "65002",
                "nets"       : ["192.168.10.0/24", "192.168.11.0/24"]
              },
              "ospf" : {
                "nets" : ["192.168.10.0/24", "192.168.113.0/30"]
              }
            }
          }

    - name: ctlabs.playbooks.setup.frr.local_facts
      when: ctg_host == 'ro2'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_frr.fact"
        content: |
          {
            "daemons" : { 
              "enabled" : [ "bgpd", "ospfd" ],
              "profile" : "datacenter"
            },
            "router" : {
              "bgp" : {
                "local_asn"  : "65002",
                "local_ip"   : "10.8.15.2",
                "remote_ip"  : "10.8.15.1",
                "remote_asn" : "65001",
                "nets"       : ["192.168.20.0/24", "192.168.23.0/24"]
              },
              "ospf" : {
                "nets" : ["192.168.20.0/24", "192.168.21.0/24", "192.168.124.0/30"]
              }
            }
          }

    - name: ctlabs.playbooks.setup.frr.local_facts
      when: ctg_host == 'ro3'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_frr.fact"
        content: |
          {
            "daemons" : { 
              "enabled" : [ "ospfd" ]
            },
            "router" : {
              "ospf" : {
                "nets" : ["192.168.11.0/24", "192.168.12.0/24", "192.168.113.0/30"]
              }
            }
          }

    - name: ctlabs.playbooks.setup.frr.local_facts
      when: ctg_host == 'ro4'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_frr.fact"
        content: |
          {
            "daemons" : { 
              "enabled" : [ "ospfd" ]
            },
            "router" : {
              "ospf" : {
                "nets" : ["192.168.22.0/24", "192.168.23.0/24", "192.168.124.0/30"]
              }
            }
          }


    - name: ctlabs.playbooks.setup.frr.local_facts
      when: ctg_host == 'isp1'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_frr.fact"
        content: |
          {
            "daemons" : { 
              "enabled" : [ "bgpd" ],
              "profile" : "datacenter"
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_rundeck
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.rundeck
  hosts: ansible
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.rundeck.local_facts
      when: ctg_host == 'ansible'
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_rundeck.fact"
        content: |
          {
            "rundeck" : {
              "server_url"    : "https://{{ CTLABS_HOST }}:8192",
              "auth_provider" : "ad"
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_kafka
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.kafka
  hosts: kafka1,kafka2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.kafka.local_facts
      when: ctg_host in ['kafka1', 'kafka2']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_kafka.fact"
        content: |
          {
            "kafka" : {
              "server_address" : "{{ CTLABS_HOST }}:9092",
              "auth_method"    : "SASL_PLAINTEXT"
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_k3s
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.k3s
  hosts: k3s1,k3s2,k3s3,k3s4
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.k3s.server.local_facts
      when: ctg_host in ['k3s1']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_k3s.fact"
        content: |
          {
            "plane"   : "control",
            "role"    : "server",
            "ingress" : {
              "type"     : "gateway_api",
              "provider" : "traefik"
            }
          }

    - name: ctlabs.playbooks.setup.k3s.agent.control.local_facts
      when: ctg_host in ['k3s2', 'k3s3']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_k3s.fact"
        content: |
          {
            "plane"       : "control",
            "role"        : "agent",
            "server_node" : "k3s1",
            "server_url"  : "https://k3s1.ctlabs.internal:6443"
          }

    - name: ctlabs.playbooks.setup.k3s.agent.data.local_facts
      when: ctg_host in ['k3s4']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_k3s.fact"
        content: |
          {
            "plane"       : "data",
            "role"        : "agent",
            "server_node" : "k3s1",
            "server_url"  : "https://k3s1.ctlabs.internal:6443"
          }

# -----------------------------------------------------------------------------
# ctlabs_rke2
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.rke2
  hosts: rke21,rke22,rke23,rke24
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.rke2.server.local_facts
      when: ctg_host in ['rke21']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_rke2.fact"
        content: |
          {
            "plane" : "control",
            "role"  : "server",
            "ingress" : {
              "type"     : "gateway_api",
              "provider" : "traefik",
              "traefik"  : {
                "host_network" : true,
                "service_type" : "ClusterIP"
              }
            }
          }

    - name: ctlabs.playbooks.setup.rke2.agent.local_facts
      when: ctg_host in ['rke22', 'rke23']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_rke2.fact"
        content: |
          {
            "plane"       : "control",
            "role"        : "agent",
            "server_node" : "rke21",
            "server_url"  : "https://rke21.ctlabs.internal:9345"
          }

    - name: ctlabs.playbooks.setup.rke2.agent.local_facts
      when: ctg_host in ['rke24']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_rke2.fact"
        content: |
          {
            "plane"       : "data",
            "role"        : "agent",
            "server_node" : "rke21",
            "server_url"  : "https://rke21.ctlabs.internal:9345"
          }

# -----------------------------------------------------------------------------
# ctlabs_kind
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.kind
  hosts: kind1,kind2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.kind.single.local_facts
      when: ctg_host in ['kind1']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_kind.fact"
        content: |
          {
            "plane"   : "single",
            "ingress" : {
              "type"     : "gateway_api",
              "provider" : "traefik"
            }
          }

# -----------------------------------------------------------------------------
# ctlabs_foreman
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.foreman
  hosts: fm1,fm2,fm3,fm4
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.foreman.server.local_facts
      when: ctg_host in ['fm1']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_foreman.fact"
        content: |
          {
            "role" : "server"
          }

    - name: ctlabs.playbooks.setup.foreman.proxy.local_facts
      when: ctg_host in ['fm2', 'fm3', 'fm4']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_foreman.fact"
        content: |
          {
            "role" : "proxy"
          }

# -----------------------------------------------------------------------------
# ctlabs_wazuh
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.wazuh
  hosts: wazuh1,wazuh2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.wazuh.agent.local_facts
      when: "ctg_host in groups['hosts'] and ctg_host != 'wazuh1.ctlabs.internal'"
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_wazuh.fact"
        content: |
          {
            "role"        : "agent",
            "server_addr" : "wazuh1.ctlabs.internal"
          }

# -----------------------------------------------------------------------------
# ctlabs_opendkim
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.opendkim
  hosts: mail1,mail2
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.opendkim.local_facts
      when: ctg_host in ['mail1']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_opendkim.fact"
        content: |
          {
            "domain"   : "ctlabs.internal"
          }

# -----------------------------------------------------------------------------
# ctlabs_chrony
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.chrony
  hosts: h3,h4
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.chrony.server.local_facts
      when: ctg_host in ['h3']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_chrony.fact"
        content: |
          {
            "role"    : "server",
            "sources" : [ "ntp1.torrix.ca", "ntp2.torrix.ca", "ntp3.torrix.ca" ],
            "clients" : [ "192.168.0.0/16" ]
          }

    - name: ctlabs.playbooks.setup.chrony.client.local_facts
      when: ctg_host in ['h4']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_chrony.fact"
        content: |
          {
            "role"    : "server",
            "sources" : [ "h3.ctlabs.internal" ]
          }

# -----------------------------------------------------------------------------
# ctlabs_claude_code
# -----------------------------------------------------------------------------
- name : ctlabs.playbooks.setup.claude_code
  hosts: ansible,h1,h2,h3
  tags : setup
  tasks:
    - name: ctlabs.playbooks.setup.claude_code.local_facts
      when: ctg_host in ['ansible', 'h1', 'h2', 'h3']
      copy:
        dest: "{{ ctg_facts_dir }}/ctlabs_claude_code.fact"
        content: |
          {
            "provider" : {
              "active"     : "openrouter",
              "openrouter" : {
                "api_key" : "{{ lookup('env', 'OPENROUTER_API_KEY') }}",
                "base_url": "https://openrouter.ai/api"
              }
            },
            "otlp" : {
              "enabled" : true,
              "endpoint": "http://prometheus.ctlabs.internal:9090/v1/metrics",
              "resource_attrs" : {
                "developer"   : "{{ ansible_user }}",
                "team"        : "platform",
                "environment" : "{{ ctg_env | default('dev') }}"
              }
            },
            "preferences": {
              "model"                : "openrouter/free",
              "theme"                : "dark",
              "always_thinking"      : false,
              "fast_mode"            : true,
              "fallback_model"       : ["openrouter/free"],
              "gce_metadata_host"    : "127.0.0.1:1"
            }
          }
