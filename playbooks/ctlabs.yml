# -----------------------------------------------------------------------------------------------------------
# File        : ctlabs-ansible/playbooks/ctlabs.yml
# Description : ctlabs roles
# -----------------------------------------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# check that all nodes are up
# -----------------------------------------------------------------------------
- name        : ctlabs.playbook.nodes.up
  hosts       : all:!rhosts
  tags        : up
  gather_facts: false
  tasks       :
    - name: ctlabs.playbooks.ctlabs.up.wait
      wait_for_connection:
        delay: 5

# -----------------------------------------------------------------------------
# ctlabs setup
# -----------------------------------------------------------------------------
- import_playbook: setup.yml

# -----------------------------------------------------------------------------
# ctlabs_ca
